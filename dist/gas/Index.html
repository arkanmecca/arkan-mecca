<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><meta name="description" content="منظومة تسعير الرحلات والخدمات وعروض الشركات"><title>رحلة | التسعير والعروض</title><style>/*
 * Rihla — warm travel-paper visual theme.
 * Arkan Makkah: original supplied logo embedded; sampled burgundy #461A1F.
 * All original selectors and custom-property names are preserved.
 * Original uploaded PNG bytes are embedded without modifying the artwork.
 */
:root {
  --ink:#2b2023;
  --muted:#75646a;
  --navy:#32171d;
  --teal:#461a1f;
  --teal-soft:#eee2cf;
  --line:#d9cbb8;
  --bg:#f4ebdd;
  --white:#fffbf4;
  --gold:#b88a44;
  --red:#9a3632;
  --radius:8px;
  font-family:Tahoma,"Segoe UI",Arial,sans-serif;
  font-size:16px;
  color:var(--ink);
  background:var(--bg);
  --paper:#f4ebdd;
  --surface:#fffbf4;
  --olive:#526247;
  --focus:#461a1f;
  line-height:1.7;
  color-scheme:light;
}
* {
  box-sizing:border-box;
}
body {
  margin:0;
  direction:rtl;
  min-width:0;
  background:var(--bg);
  text-rendering:optimizeLegibility;
}
button,input,select,textarea {
  font:inherit;
}
button {
  cursor:pointer;
}
button:disabled {
  cursor:not-allowed;
  opacity:.55;
}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible {
  outline:3px solid var(--focus);
  outline-offset:3px;
}
input,select,textarea {
  width:100%;
  min-width:0;
  border:1px solid #b6a58f;
  border-radius:5px;
  padding:11px 13px;
  background:var(--white);
  color:var(--ink);
  min-height:46px;
  line-height:1.6;
  transition:border-color .15s ease,box-shadow .15s ease;
}
input[type=checkbox] {
  width:20px;
  height:20px;
  accent-color:var(--teal);
  flex:none;
  min-height:20px;
  padding:0;
}
input[type=number] {
  direction:ltr;
  text-align:right;
}
textarea {
  min-height:100px;
  resize:vertical;
  line-height:1.8;
}
label {
  display:flex;
  flex-direction:column;
  gap:8px;
  font-size:.875rem;
  font-weight:700;
  line-height:1.7;
  min-width:0;
}
h1,h2,h3,p {
  margin:0;
}
h1 {
  font-size:clamp(1.5rem,2.3vw,2rem);
  line-height:1.55;
}
h2 {
  font-size:1.3rem;
  line-height:1.65;
}
h3 {
  font-size:1rem;
  line-height:1.7;
}
p {
  line-height:1.9;
}
small,.muted {
  color:var(--muted);
}
small {
  font-size:.875rem;
  line-height:1.7;
}
a {
  color:var(--teal);
  text-underline-offset:4px;
}
.num {
  font-variant-numeric:tabular-nums;
  direction:ltr;
  display:inline-block;
  font-family:Arial,sans-serif;
  unicode-bidi:isolate;
}
.loading,.empty {
  padding:64px 24px;
  text-align:center;
  color:var(--muted);
  line-height:2;
  background:var(--white);
}
.empty strong {
  display:block;
  color:var(--ink);
  font-size:1.1rem;
}
.btn {
  border:1px solid var(--line);
  background:var(--white);
  color:var(--ink);
  border-radius:5px;
  min-height:44px;
  padding:10px 18px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  font-weight:700;
  font-size:.875rem;
  line-height:1.5;
  border-color:#b6a58f;
  transition:background-color .15s ease,border-color .15s ease,box-shadow .15s ease;
  text-decoration:none;
  max-width:100%;
  white-space:normal;
}
.btn:hover {
  background:#eee2cf;
  border-color:var(--teal);
}
.btn.primary {
  background:var(--teal);
  color:var(--white);
  border-color:var(--teal);
  box-shadow:inset 0 1px 0 #ffffff18;
}
.btn.primary:hover {
  background:#351218;
}
.btn.danger {
  color:var(--red);
  border-color:#dab8b0;
  background:#fff8f3;
}
.btn.small {
  min-height:38px;
  padding:7px 11px;
}
.btn.ghost {
  background:transparent;
  border-color:transparent;
}
.shell {
  display:grid;
  grid-template-columns:256px minmax(0,1fr);
  min-height:100vh;
}
.sidebar {
  background:linear-gradient(160deg,#48262e,var(--navy) 65%);
  color:var(--white);
  padding:32px 18px 22px;
  display:flex;
  flex-direction:column;
  gap:32px;
  position:sticky;
  top:0;
  height:100dvh;
  overflow-y:auto;
  border-inline-end:1px solid #79505a;
  scrollbar-width:thin;
}
.brand {
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 10px;
  min-width:0;
}
.brand-mark {
  width:52px;
  height:52px;
  display:grid;
  place-items:center;
  background:#542b35;
  border-radius:6px;
  font-size:1.45rem;
  font-weight:bold;
  flex:none;
  border:1px solid var(--gold);
  color:#f3e5c8;
}
.brand strong {
  font-size:1.45rem;
  line-height:1.6;
}
.brand small {
  color:#ead9d6;
  display:block;
  font-size:.75rem;
  line-height:1.8;
}
.nav {
  display:grid;
  gap:9px;
}
.nav button {
  text-align:right;
  background:none;
  border:1px solid transparent;
  color:#eee2cf;
  border-radius:5px;
  padding:12px 14px;
  font-size:1rem;
  font-weight:bold;
  display:flex;
  align-items:center;
  gap:12px;
  min-height:48px;
  line-height:1.7;
  transition:background-color .15s ease;
}
.nav button:hover {
  background:#542b35;
}
.nav button.active {
  background:#f4ebdd;
  color:#351218;
  border-color:#d9cbb8;
  box-shadow:inset -4px 0 0 var(--gold);
}
.nav svg {
  width:20px;
  height:20px;
  flex:none;
}
.sidebar-bottom {
  margin-top:auto;
  border-top:1px dashed #a67983;
  padding-top:20px;
}
.sidebar-bottom small {
  color:#ead9d6;
}
.sidebar-bottom .btn {
  color:var(--white);
  border-color:#a67983;
  margin-top:12px;
  background:transparent;
}
.workspace {
  min-width:0;
}
.topbar {
  min-height:86px;
  border-bottom:1px solid var(--line);
  background:var(--white);
  padding:18px 36px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
}
.topbar .organization {
  font-size:.875rem;
  color:var(--muted);
}
.user-chip {
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:bold;
  font-size:.875rem;
  min-width:0;
  flex-wrap:wrap;
}
.avatar {
  width:40px;
  height:40px;
  border-radius:7px;
  display:grid;
  place-items:center;
  background:#f3e5c8;
  color:var(--teal);
  flex:none;
  border:1px solid #c9ad79;
}
.main {
  padding:36px 36px 56px;
  max-width:1600px;
  margin:auto;
}
.page-head {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  margin-bottom:28px;
  flex-wrap:wrap;
}
.page-head p {
  margin-top:6px;
  color:var(--muted);
  font-size:.95rem;
}
.eyebrow {
  font-size:.8rem;
  color:var(--teal);
  font-weight:bold;
  margin-bottom:5px;
  line-height:1.8;
}
.stats {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
  margin-bottom:28px;
}
.stat {
  background:var(--white);
  border:1px solid var(--line);
  border-radius:3px;
  padding:22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  border-top:3px solid var(--gold);
  min-width:0;
  flex-wrap:wrap;
  box-shadow:none;
}
.stat strong {
  font-size:1.85rem;
  line-height:1.4;
  font-variant-numeric:tabular-nums;
  overflow-wrap:anywhere;
}
.stat span {
  color:var(--muted);
  font-size:.875rem;
}
.panel {
  background:var(--white);
  border:1px solid var(--line);
  border-radius:8px;
  overflow:hidden;
  box-shadow:none;
}
.panel-pad {
  padding:28px;
}
.toolbar {
  padding:18px 22px;
  display:flex;
  gap:14px;
  align-items:center;
  border-bottom:1px solid var(--line);
  flex-wrap:wrap;
  background:#f8f1e6;
}
.toolbar input {
  max-width:340px;
}
.toolbar select {
  width:auto;
  min-width:140px;
  max-width:100%;
}
.table-wrap {
  overflow-x:auto;
  max-width:100%;
  overscroll-behavior-x:contain;
  scrollbar-color:#b6a58f #f4ebdd;
  scrollbar-width:thin;
}
table {
  border-collapse:collapse;
  width:100%;
  text-align:right;
  font-size:.875rem;
  line-height:1.8;
  font-variant-numeric:tabular-nums;
}
th {
  background:#eee2cf;
  color:var(--ink);
  font-weight:700;
  white-space:nowrap;
  font-size:.8125rem;
  padding-block:14px;
}
td,th {
  padding:16px 20px;
  border-bottom:1px solid var(--line);
  vertical-align:middle;
}
td {
  overflow-wrap:anywhere;
}
tbody tr:last-child td {
  border-bottom:0;
}
tbody tr:hover {
  background:#f4ebdd;
}
.table-title {
  font-size:.95rem;
  font-weight:bold;
  color:var(--ink);
  display:block;
  min-width:140px;
}
.actions {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  min-width:120px;
}
.badge {
  border-radius:3px;
  background:#eee2cf;
  color:#75646a;
  padding:3px 9px;
  display:inline-block;
  white-space:nowrap;
  font-size:.8rem;
  font-weight:bold;
  border:1px solid #d9cbb8;
  line-height:1.8;
}
.badge.ok {
  background:#e9eddf;
  color:#526247;
  border-color:#bdc9ad;
}
.badge.gold {
  background:#f3e5c8;
  color:#461a1f;
  border-color:#c9ad79;
}
.badge.danger {
  background:#f6e7e1;
  color:#9a3632;
  border-color:#dab8b0;
}
.money {
  font-size:1.08rem;
  font-weight:bold;
  color:var(--teal);
  white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
.hint {
  background:#f4ebdd;
  border:1px solid #d9cbb8;
  border-radius:5px;
  padding:14px 16px;
  color:#461a1f;
  line-height:1.9;
  font-size:.875rem;
  border-inline-start:3px solid var(--gold);
}
.hint.warn {
  background:#f3e5c8;
  border-color:#c9ad79;
  color:#461a1f;
  border-inline-start-color:var(--gold);
}
.hint.error {
  background:#f6e7e1;
  border-color:#dab8b0;
  color:var(--red);
  border-inline-start-color:var(--red);
}
.section {
  margin-top:28px;
}
.section-title {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:16px;
  gap:12px;
  flex-wrap:wrap;
}
.grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:20px;
}
.grid.three {
  grid-template-columns:repeat(3,minmax(0,1fr));
}
.grid.four {
  grid-template-columns:repeat(4,minmax(0,1fr));
}
.full {
  grid-column:1/-1;
}
.check {
  flex-direction:row;
  align-items:center;
  font-weight:normal;
  gap:10px;
  min-height:44px;
  cursor:pointer;
}
.check-group {
  display:flex;
  flex-wrap:wrap;
  gap:12px 22px;
  padding:12px 0;
}
.form-actions {
  display:flex;
  gap:10px;
  justify-content:flex-end;
  padding-top:22px;
  margin-top:26px;
  border-top:1px dashed #b6a58f;
  flex-wrap:wrap;
}
.inline {
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
}
.split {
  display:flex;
  justify-content:space-between;
  gap:16px;
  align-items:center;
  flex-wrap:wrap;
}
.divider {
  height:1px;
  background:var(--line);
  margin:26px 0;
}
.result {
  margin-top:22px;
}
.result table input {
  min-width:100px;
}
.total-card {
  padding:22px 24px;
  background:#eee2cf;
  border-radius:4px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  border:1px solid #c9ad79;
  border-inline-start:5px solid var(--gold);
  position:relative;
  flex-wrap:wrap;
}
.total-card strong {
  font-size:1.9rem;
  color:var(--teal);
  line-height:1.45;
  font-variant-numeric:tabular-nums;
  overflow-wrap:anywhere;
}
.line-editor {
  border:1px solid var(--line);
  border-radius:6px;
  padding:22px;
  margin-bottom:16px;
  background:var(--white);
  border-inline-start:3px solid #c9ad79;
}
.line-editor h3 {
  line-height:1.8;
}
.line-editor .grid {
  margin-top:16px;
}
.line-editor .source-price {
  color:var(--teal);
  font-size:.875rem;
  margin-top:8px;
}
.extra-row {
  display:grid;
  grid-template-columns:minmax(0,1fr) 140px auto;
  gap:8px;
  margin-bottom:8px;
  align-items:end;
}
.preview {
  line-height:1.9;
  background:var(--white);
  padding:24px;
  border:1px solid var(--line);
  border-top:3px solid var(--gold);
  border-radius:4px;
}
.preview h2 {
  margin-bottom:10px;
}
.preview p {
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.tabs {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:22px;
  padding-bottom:12px;
  border-bottom:1px solid var(--line);
}
.tabs .active {
  background:var(--teal-soft);
  border-color:var(--teal);
  color:var(--teal);
  box-shadow:inset 0 -3px 0 var(--gold);
}
.login-page {
  min-height:100dvh;
  display:grid;
  grid-template-columns:1fr 1fr;
  background:var(--bg);
}
.login-aside {
  background:linear-gradient(145deg,#542b35,var(--navy) 70%);
  color:var(--white);
  padding:clamp(32px,5vw,72px);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  gap:50px;
  border-inline-end:1px solid #a67983;
}
.login-aside h1 {
  font-size:clamp(2rem,3.5vw,3.25rem);
  line-height:1.65;
  max-width:460px;
}
.login-aside p {
  color:#ead9d6;
  max-width:440px;
  margin-top:24px;
  font-size:1.05rem;
}
.login-aside .brand {
  padding:0;
}
.login-main {
  display:flex;
  align-items:center;
  justify-content:center;
  padding:48px 32px;
  background:var(--bg);
}
.login-form {
  width:100%;
  max-width:460px;
  padding:32px;
  background:var(--white);
  border:1px solid var(--line);
  border-top:4px solid var(--gold);
  border-radius:6px;
}
.login-form h2 {
  font-size:1.8rem;
  margin-bottom:12px;
  line-height:1.65;
}
.login-form p {
  margin-bottom:32px;
  color:var(--muted);
}
.login-form label {
  margin-bottom:20px;
}
.login-form .btn {
  width:100%;
  margin-top:8px;
  min-height:50px;
}
.login-foot {
  border-top:1px dashed #a67983;
  padding-top:25px;
  color:#ead9d6;
  font-size:.875rem;
  line-height:1.8;
}
.mobile-menu {
  display:none;
}
.form-error {
  margin-top:16px;
}
dialog {
  padding:0;
  width:min(960px,calc(100% - 48px));
  max-height:calc(100dvh - 48px);
  border:1px solid #b6a58f;
  border-radius:10px;
  box-shadow:0 24px 80px #2b202333;
  color:var(--ink);
  margin:auto;
  border-top:4px solid var(--gold);
  background:var(--white);
  direction:rtl;
  overflow-y:auto;
  overscroll-behavior:contain;
  scroll-padding-block:100px 110px;
  scrollbar-gutter:stable;
}
dialog::backdrop {
  background:#2b202399;
  backdrop-filter:blur(4px);
}
.dialog-head {
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  padding:20px 28px;
  border-bottom:1px solid var(--line);
  position:sticky;
  top:0;
  background:var(--white);
  z-index:2;
  gap:16px;
  box-shadow:0 3px 0 #2b202306;
}
.dialog-body {
  padding:28px;
  min-width:0;
}
#toast {
  position:fixed;
  bottom:max(24px,env(safe-area-inset-bottom));
  left:24px;
  max-width:min(460px,calc(100% - 48px));
  background:var(--navy);
  color:var(--white);
  border-radius:6px;
  padding:16px 22px;
  z-index:100;
  box-shadow:0 8px 25px #2b202326;
  display:none;
  line-height:1.8;
  border:1px solid #a67983;
  border-inline-start:4px solid var(--gold);
  overflow-wrap:anywhere;
}
#print-root {
  display:none;
}
.break-text {
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
@media(max-width:1100px) {
  .shell {
    grid-template-columns:210px minmax(0,1fr);
  }
  .main {
    padding:25px 20px;
  }
  .topbar {
    padding:18px 20px;
  }
  .grid.four {
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
  .stat {
    padding:16px;
  }
}
@media(max-width:760px) {
  .shell {
    display:block;
  }
  .sidebar {
    display:none;
    position:fixed;
    right:0;
    width:min(290px,calc(100vw - 48px));
    z-index:20;
  }
  .sidebar.open {
    display:flex;
    box-shadow:-20px 0 100px #2b202359;
  }
  .mobile-menu {
    display:inline-flex;
  }
  .topbar {
    padding:12px 16px;
    min-height:70px;
  }
  .topbar .organization {
    display:none;
  }
  .main {
    padding:22px 14px;
  }
  .page-head {
    align-items:flex-start;
    flex-wrap:wrap;
    margin-bottom:20px;
  }
  h1 {
    font-size:1.45rem;
  }
  .page-head p {
    font-size:.875rem;
  }
  .stats {
    gap:8px;
    margin-bottom:18px;
  }
  .stat {
    padding:12px;
    display:block;
  }
  .stat span {
    font-size:.8rem;
    display:block;
    margin-bottom:8px;
  }
  .stat strong {
    font-size:1.4rem;
  }
  .grid,.grid.three,.grid.four {
    grid-template-columns:1fr;
  }
  .toolbar {
    padding:14px;
  }
  .toolbar input {
    max-width:none;
    flex:1;
    min-width:160px;
  }
  .toolbar select {
    flex:1;
  }
  .panel-pad {
    padding:18px;
  }
  .dialog-body,.dialog-head {
    padding:18px;
  }
  dialog {
    width:calc(100% - 16px);
    max-height:calc(100dvh - 16px);
    border-radius:8px;
  }
  .form-actions {
    position:sticky;
    bottom:-18px;
    background:var(--white);
    padding:14px 0;
    margin-top:20px;
    z-index:1;
    flex-wrap:wrap;
  }
  .form-actions .btn {
    flex:1;
  }
  .login-page {
    display:block;
  }
  .login-aside {
    padding:24px;
    gap:22px;
  }
  .login-aside h1 {
    font-size:1.65rem;
  }
  .login-aside p,.login-foot {
    display:none;
  }
  .login-main {
    padding:32px 22px;
  }
  .login-form h2 {
    font-size:1.4rem;
  }
  .table-wrap table {
    min-width:630px;
  }
  td,th {
    padding:12px;
  }
  .extra-row {
    grid-template-columns:minmax(0,1fr) 100px auto;
  }
  .line-editor {
    padding:14px;
  }
  .total-card {
    flex-wrap:wrap;
  }
}
@media print {
  @page {
    size:A4;
    margin:15mm;
  }
  body {
    background:white;
    font-size:12pt;
    color:#000;
  }
  #app,dialog,#toast {
    display:none!important;
  }
  #print-root {
    display:block!important;
  }
  #print-root h1 {
    font-size:22pt;
    margin-bottom:10mm;
  }
  #print-root table {
    font-size:11pt;
    table-layout:auto;
    width:100%;
    min-width:0;
  }
  #print-root td,#print-root th {
    padding:3mm;
    border:1px solid #b6a58f;
    white-space:normal;
    overflow-wrap:anywhere;
  }
  thead {
    display:table-header-group;
  }
  tfoot {
    display:table-row-group;
  }
  tr {
    break-inside:avoid;
  }
  p {
    white-space:pre-wrap;
    overflow-wrap:anywhere;
  }
  .print-meta {
    margin-bottom:8mm;
  }
  .print-total {
    margin-top:8mm;
    border-top:2px solid #2b2023;
    padding-top:4mm;
    font-size:16pt;
    font-weight:bold;
  }
}
[hidden] {
  display:none!important;
}
@media(max-width:760px) {
  #list-results .table-wrap table,#list-results tbody {
    display:block;
    min-width:0;
    width:100%;
  }
  #list-results thead {
    display:none;
  }
  #list-results tbody tr {
    display:grid;
    grid-template-columns:1fr 1fr;
    padding:16px;
    gap:12px;
    border-bottom:1px solid var(--line);
  }
  #list-results td {
    display:block;
    padding:0;
    border:0;
    min-width:0;
  }
  #list-results td:first-child,#list-results td:last-child {
    grid-column:1/-1;
  }
  #list-results td:before {
    content:attr(data-label);
    display:block;
    color:var(--muted);
    font-size:.8rem;
    margin-bottom:5px;
  }
  #list-results td:first-child:before,#list-results td:last-child:before {
    display:none;
  }
  #list-results .table-title {
    min-width:0;
  }
  #list-results .actions {
    padding-top:8px;
  }
  #list-results .actions .btn {
    flex:1;
    min-height:42px;
  }
}
.extras .extra-row {
  grid-template-columns:repeat(2,minmax(0,1fr));
  padding:16px;
  border-radius:5px;
  background:#f4ebdd;
  align-items:end;
  border:1px dashed #b6a58f;
  gap:12px;
}
.extras .extra-row .btn {
  justify-self:start;
}
.total-card+.total-card {
  margin-top:12px;
  border-top:1px dashed #b6a58f;
}
/* Additions use existing classes;
no HTML or JavaScript changes required. */
::selection {
  background:#e3c795;
  color:#2b2023;
}
input::placeholder,textarea::placeholder {
  color:#75646a;
  opacity:1;
}
input:focus,select:focus,textarea:focus {
  border-color:var(--teal);
  box-shadow:0 0 0 3px #461a1f14;
}
input:disabled,select:disabled,textarea:disabled {
  background:#eee2cf;
  color:#75646a;
  cursor:not-allowed;
  opacity:1;
}
input[readonly],textarea[readonly] {
  background:#f4ebdd;
  border-style:dashed;
}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"] {
  border-color:var(--red);
}
input[type=email],input[type=url],input[type=tel] {
  direction:ltr;
  text-align:right;
  unicode-bidi:plaintext;
}
button:disabled:hover {
  box-shadow:none;
}
.btn.danger:hover {
  background:#f6e7e1;
  border-color:var(--red);
}
.sidebar-bottom .btn:hover {
  background:#542b35;
  border-color:#ead9d6;
}
.sidebar button:focus-visible,.sidebar a:focus-visible,.login-aside a:focus-visible {
  outline-color:#e3c795;
}
.brand-mark img {
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
}
.page-head>*,.dialog-head>*,.total-card>*,.split>* {
  min-width:0;
}
.stat:nth-child(2) {
  border-top-color:var(--teal);
}
.stat:nth-child(3) {
  border-top-color:var(--olive);
}
tbody tr:focus-within {
  background:#f4ebdd;
}
.total-card::before {
  content:"";
  position:absolute;
  inset-block:12px;
  inset-inline-start:10px;
  border-inline-start:1px dashed #b88a44;
  pointer-events:none;
}
.dialog-head h2 {
  font-size:1.2rem;
  overflow-wrap:anywhere;
}
.dialog-head .btn {
  flex-shrink:0;
  min-width:44px;
  min-height:44px;
}
.dialog-body .form-actions {
  position:sticky;
  bottom:-28px;
  z-index:1;
  background:var(--white);
  padding:16px 0;
  box-shadow:0 -8px 16px #fffbf4e6;
}
.dialog-body input,.dialog-body select,.dialog-body textarea,.dialog-body button {
  scroll-margin-block:100px 110px;
}
@media(max-width:760px) {
  .sidebar {
    padding-top:24px;
    height:100dvh;
  }
  .topbar {
    gap:10px;
  }
  .stat strong {
    font-size:clamp(1.1rem,4vw,1.4rem);
  }
  .toolbar input,.toolbar select {
    min-width:0;
    flex:1 1 180px;
  }
  .btn.small {
    min-height:44px;
  }
  .dialog-head {
    gap:12px;
  }
  .dialog-body .form-actions {
    bottom:-18px;
    padding-bottom:max(14px,env(safe-area-inset-bottom));
  }
  .login-form {
    padding:24px 20px;
  }
  .login-main {
    padding:24px 16px;
  }
  .preview {
    padding:18px;
  }
  .total-card {
    padding:18px 24px;
  }
  .extras .extra-row {
    grid-template-columns:1fr;
  }
}
@media(max-width:380px) {
  .stats {
    grid-template-columns:1fr;
  }
  .stat {
    display:flex;
    align-items:center;
    gap:10px;
  }
  .stat span {
    margin:0;
  }
  .extra-row {
    grid-template-columns:minmax(0,1fr) 90px;
  }
  .extra-row .btn {
    grid-column:1/-1;
    justify-self:start;
  }
  #list-results tbody tr {
    grid-template-columns:1fr;
  }
}
@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    animation:none!important;
    transition:none!important;
    scroll-behavior:auto!important;
  }
}
@media print {
  :root {
    --white:#fff;
    --bg:#fff;
    --ink:#000;
    --muted:#444;
    --line:#aaa;
  }
  .preview,.panel,.stat,.total-card,.line-editor {
    background:white;
    box-shadow:none;
  }
  .total-card::before {
    display:none;
  }
  .money,.total-card strong {
    color:#000;
  }
}

/* Real company logo, swapped in for the placeholder letter mark. Wrapped in a light
   card since the artwork's dark maroon text needs a light background to stay legible
   on the dark sidebar/login aside. */
.brand-mark-logo{width:auto;height:auto;min-width:0;background:var(--white,#fff);border-radius:8px;padding:6px 10px;display:inline-flex;align-items:center;justify-content:center;box-shadow:none}
.brand-mark-logo img{display:block;height:36px;width:auto;max-width:168px;object-fit:contain}
@media (max-width:760px){.brand-mark-logo img{height:30px}}

/* Company home screen: full room-by-room pricing shown directly, no dialog needed. */
.offer-card{background:var(--white,#fff);border:1px solid var(--line);border-radius:var(--radius,10px);padding:18px;margin-bottom:16px}
.offer-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.offer-card .table-wrap{margin:0}
