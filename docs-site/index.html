<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><meta name="description" content="منظومة تسعير الرحلات والخدمات وعروض الشركات"><title>رحلة | التسعير والعروض</title><style>/*
 * Rihla — warm travel-paper visual theme.
 * Arkan Makkah: original supplied logo embedded; sampled burgundy #461A1F.
 * All original selectors and custom-property names are preserved.
 * Original uploaded PNG bytes are embedded without modifying the artwork.
 */
:root {
  --ink:#2b2023;
  --muted:#75646a;
  --navy:#32171d;
  --teal:#461a1f;
  --teal-soft:#eee2cf;
  --line:#d9cbb8;
  --bg:#f4ebdd;
  --white:#fffbf4;
  --gold:#b88a44;
  --red:#9a3632;
  --radius:8px;
  font-family:Tahoma,"Segoe UI",Arial,sans-serif;
  font-size:16px;
  color:var(--ink);
  background:var(--bg);
  --paper:#f4ebdd;
  --surface:#fffbf4;
  --olive:#526247;
  --focus:#461a1f;
  line-height:1.7;
  color-scheme:light;
}
* {
  box-sizing:border-box;
}
body {
  margin:0;
  direction:rtl;
  min-width:0;
  background:var(--bg);
  text-rendering:optimizeLegibility;
}
button,input,select,textarea {
  font:inherit;
}
button {
  cursor:pointer;
}
button:disabled {
  cursor:not-allowed;
  opacity:.55;
}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible {
  outline:3px solid var(--focus);
  outline-offset:3px;
}
input,select,textarea {
  width:100%;
  min-width:0;
  border:1px solid #b6a58f;
  border-radius:5px;
  padding:11px 13px;
  background:var(--white);
  color:var(--ink);
  min-height:46px;
  line-height:1.6;
  transition:border-color .15s ease,box-shadow .15s ease;
}
input[type=checkbox] {
  width:20px;
  height:20px;
  accent-color:var(--teal);
  flex:none;
  min-height:20px;
  padding:0;
}
input[type=number] {
  direction:ltr;
  text-align:right;
}
textarea {
  min-height:100px;
  resize:vertical;
  line-height:1.8;
}
label {
  display:flex;
  flex-direction:column;
  gap:8px;
  font-size:.875rem;
  font-weight:700;
  line-height:1.7;
  min-width:0;
}
h1,h2,h3,p {
  margin:0;
}
h1 {
  font-size:clamp(1.5rem,2.3vw,2rem);
  line-height:1.55;
}
h2 {
  font-size:1.3rem;
  line-height:1.65;
}
h3 {
  font-size:1rem;
  line-height:1.7;
}
p {
  line-height:1.9;
}
small,.muted {
  color:var(--muted);
}
small {
  font-size:.875rem;
  line-height:1.7;
}
a {
  color:var(--teal);
  text-underline-offset:4px;
}
.num {
  font-variant-numeric:tabular-nums;
  direction:ltr;
  display:inline-block;
  font-family:Arial,sans-serif;
  unicode-bidi:isolate;
}
.loading,.empty {
  padding:64px 24px;
  text-align:center;
  color:var(--muted);
  line-height:2;
  background:var(--white);
}
.empty strong {
  display:block;
  color:var(--ink);
  font-size:1.1rem;
}
.btn {
  border:1px solid var(--line);
  background:var(--white);
  color:var(--ink);
  border-radius:5px;
  min-height:44px;
  padding:10px 18px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  font-weight:700;
  font-size:.875rem;
  line-height:1.5;
  border-color:#b6a58f;
  transition:background-color .15s ease,border-color .15s ease,box-shadow .15s ease;
  text-decoration:none;
  max-width:100%;
  white-space:normal;
}
.btn:hover {
  background:#eee2cf;
  border-color:var(--teal);
}
.btn.primary {
  background:var(--teal);
  color:var(--white);
  border-color:var(--teal);
  box-shadow:inset 0 1px 0 #ffffff18;
}
.btn.primary:hover {
  background:#351218;
}
.btn.danger {
  color:var(--red);
  border-color:#dab8b0;
  background:#fff8f3;
}
.btn.small {
  min-height:38px;
  padding:7px 11px;
}
.btn.ghost {
  background:transparent;
  border-color:transparent;
}
.shell {
  display:grid;
  grid-template-columns:256px minmax(0,1fr);
  min-height:100vh;
}
.sidebar {
  background:linear-gradient(160deg,#48262e,var(--navy) 65%);
  color:var(--white);
  padding:32px 18px 22px;
  display:flex;
  flex-direction:column;
  gap:32px;
  position:sticky;
  top:0;
  height:100dvh;
  overflow-y:auto;
  border-inline-end:1px solid #79505a;
  scrollbar-width:thin;
}
.brand {
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 10px;
  min-width:0;
}
.brand-mark {
  width:52px;
  height:52px;
  display:grid;
  place-items:center;
  background:#542b35;
  border-radius:6px;
  font-size:1.45rem;
  font-weight:bold;
  flex:none;
  border:1px solid var(--gold);
  color:#f3e5c8;
}
.brand strong {
  font-size:1.45rem;
  line-height:1.6;
}
.brand small {
  color:#ead9d6;
  display:block;
  font-size:.75rem;
  line-height:1.8;
}
.nav {
  display:grid;
  gap:9px;
}
.nav button {
  text-align:right;
  background:none;
  border:1px solid transparent;
  color:#eee2cf;
  border-radius:5px;
  padding:12px 14px;
  font-size:1rem;
  font-weight:bold;
  display:flex;
  align-items:center;
  gap:12px;
  min-height:48px;
  line-height:1.7;
  transition:background-color .15s ease;
}
.nav button:hover {
  background:#542b35;
}
.nav button.active {
  background:#f4ebdd;
  color:#351218;
  border-color:#d9cbb8;
  box-shadow:inset -4px 0 0 var(--gold);
}
.nav svg {
  width:20px;
  height:20px;
  flex:none;
}
.sidebar-bottom {
  margin-top:auto;
  border-top:1px dashed #a67983;
  padding-top:20px;
}
.sidebar-bottom small {
  color:#ead9d6;
}
.sidebar-bottom .btn {
  color:var(--white);
  border-color:#a67983;
  margin-top:12px;
  background:transparent;
}
.workspace {
  min-width:0;
}
.topbar {
  min-height:86px;
  border-bottom:1px solid var(--line);
  background:var(--white);
  padding:18px 36px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
}
.topbar .organization {
  font-size:.875rem;
  color:var(--muted);
}
.user-chip {
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:bold;
  font-size:.875rem;
  min-width:0;
  flex-wrap:wrap;
}
.avatar {
  width:40px;
  height:40px;
  border-radius:7px;
  display:grid;
  place-items:center;
  background:#f3e5c8;
  color:var(--teal);
  flex:none;
  border:1px solid #c9ad79;
}
.main {
  padding:36px 36px 56px;
  max-width:1600px;
  margin:auto;
}
.page-head {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  margin-bottom:28px;
  flex-wrap:wrap;
}
.page-head p {
  margin-top:6px;
  color:var(--muted);
  font-size:.95rem;
}
.eyebrow {
  font-size:.8rem;
  color:var(--teal);
  font-weight:bold;
  margin-bottom:5px;
  line-height:1.8;
}
.stats {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
  margin-bottom:28px;
}
.stat {
  background:var(--white);
  border:1px solid var(--line);
  border-radius:3px;
  padding:22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  border-top:3px solid var(--gold);
  min-width:0;
  flex-wrap:wrap;
  box-shadow:none;
}
.stat strong {
  font-size:1.85rem;
  line-height:1.4;
  font-variant-numeric:tabular-nums;
  overflow-wrap:anywhere;
}
.stat span {
  color:var(--muted);
  font-size:.875rem;
}
.panel {
  background:var(--white);
  border:1px solid var(--line);
  border-radius:8px;
  overflow:hidden;
  box-shadow:none;
}
.panel-pad {
  padding:28px;
}
.toolbar {
  padding:18px 22px;
  display:flex;
  gap:14px;
  align-items:center;
  border-bottom:1px solid var(--line);
  flex-wrap:wrap;
  background:#f8f1e6;
}
.toolbar input {
  max-width:340px;
}
.toolbar select {
  width:auto;
  min-width:140px;
  max-width:100%;
}
.table-wrap {
  overflow-x:auto;
  max-width:100%;
  overscroll-behavior-x:contain;
  scrollbar-color:#b6a58f #f4ebdd;
  scrollbar-width:thin;
}
table {
  border-collapse:collapse;
  width:100%;
  text-align:right;
  font-size:.875rem;
  line-height:1.8;
  font-variant-numeric:tabular-nums;
}
th {
  background:#eee2cf;
  color:var(--ink);
  font-weight:700;
  white-space:nowrap;
  font-size:.8125rem;
  padding-block:14px;
}
td,th {
  padding:16px 20px;
  border-bottom:1px solid var(--line);
  vertical-align:middle;
}
td {
  overflow-wrap:anywhere;
}
tbody tr:last-child td {
  border-bottom:0;
}
tbody tr:hover {
  background:#f4ebdd;
}
.table-title {
  font-size:.95rem;
  font-weight:bold;
  color:var(--ink);
  display:block;
  min-width:140px;
}
.actions {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  min-width:120px;
}
.badge {
  border-radius:3px;
  background:#eee2cf;
  color:#75646a;
  padding:3px 9px;
  display:inline-block;
  white-space:nowrap;
  font-size:.8rem;
  font-weight:bold;
  border:1px solid #d9cbb8;
  line-height:1.8;
}
.badge.ok {
  background:#e9eddf;
  color:#526247;
  border-color:#bdc9ad;
}
.badge.gold {
  background:#f3e5c8;
  color:#461a1f;
  border-color:#c9ad79;
}
.badge.danger {
  background:#f6e7e1;
  color:#9a3632;
  border-color:#dab8b0;
}
.money {
  font-size:1.08rem;
  font-weight:bold;
  color:var(--teal);
  white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
.hint {
  background:#f4ebdd;
  border:1px solid #d9cbb8;
  border-radius:5px;
  padding:14px 16px;
  color:#461a1f;
  line-height:1.9;
  font-size:.875rem;
  border-inline-start:3px solid var(--gold);
}
.hint.warn {
  background:#f3e5c8;
  border-color:#c9ad79;
  color:#461a1f;
  border-inline-start-color:var(--gold);
}
.hint.error {
  background:#f6e7e1;
  border-color:#dab8b0;
  color:var(--red);
  border-inline-start-color:var(--red);
}
.section {
  margin-top:28px;
}
.section-title {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:16px;
  gap:12px;
  flex-wrap:wrap;
}
.grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:20px;
}
.grid.three {
  grid-template-columns:repeat(3,minmax(0,1fr));
}
.grid.four {
  grid-template-columns:repeat(4,minmax(0,1fr));
}
.full {
  grid-column:1/-1;
}
.check {
  flex-direction:row;
  align-items:center;
  font-weight:normal;
  gap:10px;
  min-height:44px;
  cursor:pointer;
}
.check-group {
  display:flex;
  flex-wrap:wrap;
  gap:12px 22px;
  padding:12px 0;
}
.form-actions {
  display:flex;
  gap:10px;
  justify-content:flex-end;
  padding-top:22px;
  margin-top:26px;
  border-top:1px dashed #b6a58f;
  flex-wrap:wrap;
}
.inline {
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
}
.split {
  display:flex;
  justify-content:space-between;
  gap:16px;
  align-items:center;
  flex-wrap:wrap;
}
.divider {
  height:1px;
  background:var(--line);
  margin:26px 0;
}
.result {
  margin-top:22px;
}
.result table input {
  min-width:100px;
}
.total-card {
  padding:22px 24px;
  background:#eee2cf;
  border-radius:4px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  border:1px solid #c9ad79;
  border-inline-start:5px solid var(--gold);
  position:relative;
  flex-wrap:wrap;
}
.total-card strong {
  font-size:1.9rem;
  color:var(--teal);
  line-height:1.45;
  font-variant-numeric:tabular-nums;
  overflow-wrap:anywhere;
}
.line-editor {
  border:1px solid var(--line);
  border-radius:6px;
  padding:22px;
  margin-bottom:16px;
  background:var(--white);
  border-inline-start:3px solid #c9ad79;
}
.line-editor h3 {
  line-height:1.8;
}
.line-editor .grid {
  margin-top:16px;
}
.line-editor .source-price {
  color:var(--teal);
  font-size:.875rem;
  margin-top:8px;
}
.extra-row {
  display:grid;
  grid-template-columns:minmax(0,1fr) 140px auto;
  gap:8px;
  margin-bottom:8px;
  align-items:end;
}
.preview {
  line-height:1.9;
  background:var(--white);
  padding:24px;
  border:1px solid var(--line);
  border-top:3px solid var(--gold);
  border-radius:4px;
}
.preview h2 {
  margin-bottom:10px;
}
.preview p {
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.tabs {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:22px;
  padding-bottom:12px;
  border-bottom:1px solid var(--line);
}
.tabs .active {
  background:var(--teal-soft);
  border-color:var(--teal);
  color:var(--teal);
  box-shadow:inset 0 -3px 0 var(--gold);
}
.login-page {
  min-height:100dvh;
  display:grid;
  grid-template-columns:1fr 1fr;
  background:var(--bg);
}
.login-aside {
  background:linear-gradient(145deg,#542b35,var(--navy) 70%);
  color:var(--white);
  padding:clamp(32px,5vw,72px);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  gap:50px;
  border-inline-end:1px solid #a67983;
}
.login-aside h1 {
  font-size:clamp(2rem,3.5vw,3.25rem);
  line-height:1.65;
  max-width:460px;
}
.login-aside p {
  color:#ead9d6;
  max-width:440px;
  margin-top:24px;
  font-size:1.05rem;
}
.login-aside .brand {
  padding:0;
}
.login-main {
  display:flex;
  align-items:center;
  justify-content:center;
  padding:48px 32px;
  background:var(--bg);
}
.login-form {
  width:100%;
  max-width:460px;
  padding:32px;
  background:var(--white);
  border:1px solid var(--line);
  border-top:4px solid var(--gold);
  border-radius:6px;
}
.login-form h2 {
  font-size:1.8rem;
  margin-bottom:12px;
  line-height:1.65;
}
.login-form p {
  margin-bottom:32px;
  color:var(--muted);
}
.login-form label {
  margin-bottom:20px;
}
.login-form .btn {
  width:100%;
  margin-top:8px;
  min-height:50px;
}
.login-foot {
  border-top:1px dashed #a67983;
  padding-top:25px;
  color:#ead9d6;
  font-size:.875rem;
  line-height:1.8;
}
.mobile-menu {
  display:none;
}
.form-error {
  margin-top:16px;
}
dialog {
  padding:0;
  width:min(960px,calc(100% - 48px));
  max-height:calc(100dvh - 48px);
  border:1px solid #b6a58f;
  border-radius:10px;
  box-shadow:0 24px 80px #2b202333;
  color:var(--ink);
  margin:auto;
  border-top:4px solid var(--gold);
  background:var(--white);
  direction:rtl;
  overflow-y:auto;
  overscroll-behavior:contain;
  scroll-padding-block:100px 110px;
  scrollbar-gutter:stable;
}
dialog::backdrop {
  background:#2b202399;
  backdrop-filter:blur(4px);
}
.dialog-head {
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  padding:20px 28px;
  border-bottom:1px solid var(--line);
  position:sticky;
  top:0;
  background:var(--white);
  z-index:2;
  gap:16px;
  box-shadow:0 3px 0 #2b202306;
}
.dialog-body {
  padding:28px;
  min-width:0;
}
#toast {
  position:fixed;
  bottom:max(24px,env(safe-area-inset-bottom));
  left:24px;
  max-width:min(460px,calc(100% - 48px));
  background:var(--navy);
  color:var(--white);
  border-radius:6px;
  padding:16px 22px;
  z-index:100;
  box-shadow:0 8px 25px #2b202326;
  display:none;
  line-height:1.8;
  border:1px solid #a67983;
  border-inline-start:4px solid var(--gold);
  overflow-wrap:anywhere;
}
#print-root {
  display:none;
}
.break-text {
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
@media(max-width:1100px) {
  .shell {
    grid-template-columns:210px minmax(0,1fr);
  }
  .main {
    padding:25px 20px;
  }
  .topbar {
    padding:18px 20px;
  }
  .grid.four {
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
  .stat {
    padding:16px;
  }
}
@media(max-width:760px) {
  .shell {
    display:block;
  }
  .sidebar {
    display:none;
    position:fixed;
    right:0;
    width:min(290px,calc(100vw - 48px));
    z-index:20;
  }
  .sidebar.open {
    display:flex;
    box-shadow:-20px 0 100px #2b202359;
  }
  .mobile-menu {
    display:inline-flex;
  }
  .topbar {
    padding:12px 16px;
    min-height:70px;
  }
  .topbar .organization {
    display:none;
  }
  .main {
    padding:22px 14px;
  }
  .page-head {
    align-items:flex-start;
    flex-wrap:wrap;
    margin-bottom:20px;
  }
  h1 {
    font-size:1.45rem;
  }
  .page-head p {
    font-size:.875rem;
  }
  .stats {
    gap:8px;
    margin-bottom:18px;
  }
  .stat {
    padding:12px;
    display:block;
  }
  .stat span {
    font-size:.8rem;
    display:block;
    margin-bottom:8px;
  }
  .stat strong {
    font-size:1.4rem;
  }
  .grid,.grid.three,.grid.four {
    grid-template-columns:1fr;
  }
  .toolbar {
    padding:14px;
  }
  .toolbar input {
    max-width:none;
    flex:1;
    min-width:160px;
  }
  .toolbar select {
    flex:1;
  }
  .panel-pad {
    padding:18px;
  }
  .dialog-body,.dialog-head {
    padding:18px;
  }
  dialog {
    width:calc(100% - 16px);
    max-height:calc(100dvh - 16px);
    border-radius:8px;
  }
  .form-actions {
    position:sticky;
    bottom:-18px;
    background:var(--white);
    padding:14px 0;
    margin-top:20px;
    z-index:1;
    flex-wrap:wrap;
  }
  .form-actions .btn {
    flex:1;
  }
  .login-page {
    display:block;
  }
  .login-aside {
    padding:24px;
    gap:22px;
  }
  .login-aside h1 {
    font-size:1.65rem;
  }
  .login-aside p,.login-foot {
    display:none;
  }
  .login-main {
    padding:32px 22px;
  }
  .login-form h2 {
    font-size:1.4rem;
  }
  .table-wrap table {
    min-width:630px;
  }
  td,th {
    padding:12px;
  }
  .extra-row {
    grid-template-columns:minmax(0,1fr) 100px auto;
  }
  .line-editor {
    padding:14px;
  }
  .total-card {
    flex-wrap:wrap;
  }
}
@media print {
  @page {
    size:A4;
    margin:15mm;
  }
  body {
    background:white;
    font-size:12pt;
    color:#000;
  }
  #app,dialog,#toast {
    display:none!important;
  }
  #print-root {
    display:block!important;
  }
  #print-root h1 {
    font-size:22pt;
    margin-bottom:10mm;
  }
  #print-root table {
    font-size:11pt;
    table-layout:auto;
    width:100%;
    min-width:0;
  }
  #print-root td,#print-root th {
    padding:3mm;
    border:1px solid #b6a58f;
    white-space:normal;
    overflow-wrap:anywhere;
  }
  thead {
    display:table-header-group;
  }
  tfoot {
    display:table-row-group;
  }
  tr {
    break-inside:avoid;
  }
  p {
    white-space:pre-wrap;
    overflow-wrap:anywhere;
  }
  .print-meta {
    margin-bottom:8mm;
  }
  .print-total {
    margin-top:8mm;
    border-top:2px solid #2b2023;
    padding-top:4mm;
    font-size:16pt;
    font-weight:bold;
  }
}
[hidden] {
  display:none!important;
}
@media(max-width:760px) {
  #list-results .table-wrap table,#list-results tbody {
    display:block;
    min-width:0;
    width:100%;
  }
  #list-results thead {
    display:none;
  }
  #list-results tbody tr {
    display:grid;
    grid-template-columns:1fr 1fr;
    padding:16px;
    gap:12px;
    border-bottom:1px solid var(--line);
  }
  #list-results td {
    display:block;
    padding:0;
    border:0;
    min-width:0;
  }
  #list-results td:first-child,#list-results td:last-child {
    grid-column:1/-1;
  }
  #list-results td:before {
    content:attr(data-label);
    display:block;
    color:var(--muted);
    font-size:.8rem;
    margin-bottom:5px;
  }
  #list-results td:first-child:before,#list-results td:last-child:before {
    display:none;
  }
  #list-results .table-title {
    min-width:0;
  }
  #list-results .actions {
    padding-top:8px;
  }
  #list-results .actions .btn {
    flex:1;
    min-height:42px;
  }
}
.extras .extra-row {
  grid-template-columns:repeat(2,minmax(0,1fr));
  padding:16px;
  border-radius:5px;
  background:#f4ebdd;
  align-items:end;
  border:1px dashed #b6a58f;
  gap:12px;
}
.extras .extra-row .btn {
  justify-self:start;
}
.total-card+.total-card {
  margin-top:12px;
  border-top:1px dashed #b6a58f;
}
/* Additions use existing classes;
no HTML or JavaScript changes required. */
::selection {
  background:#e3c795;
  color:#2b2023;
}
input::placeholder,textarea::placeholder {
  color:#75646a;
  opacity:1;
}
input:focus,select:focus,textarea:focus {
  border-color:var(--teal);
  box-shadow:0 0 0 3px #461a1f14;
}
input:disabled,select:disabled,textarea:disabled {
  background:#eee2cf;
  color:#75646a;
  cursor:not-allowed;
  opacity:1;
}
input[readonly],textarea[readonly] {
  background:#f4ebdd;
  border-style:dashed;
}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"] {
  border-color:var(--red);
}
input[type=email],input[type=url],input[type=tel] {
  direction:ltr;
  text-align:right;
  unicode-bidi:plaintext;
}
button:disabled:hover {
  box-shadow:none;
}
.btn.danger:hover {
  background:#f6e7e1;
  border-color:var(--red);
}
.sidebar-bottom .btn:hover {
  background:#542b35;
  border-color:#ead9d6;
}
.sidebar button:focus-visible,.sidebar a:focus-visible,.login-aside a:focus-visible {
  outline-color:#e3c795;
}
.brand-mark img {
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
}
.page-head>*,.dialog-head>*,.total-card>*,.split>* {
  min-width:0;
}
.stat:nth-child(2) {
  border-top-color:var(--teal);
}
.stat:nth-child(3) {
  border-top-color:var(--olive);
}
tbody tr:focus-within {
  background:#f4ebdd;
}
.total-card::before {
  content:"";
  position:absolute;
  inset-block:12px;
  inset-inline-start:10px;
  border-inline-start:1px dashed #b88a44;
  pointer-events:none;
}
.dialog-head h2 {
  font-size:1.2rem;
  overflow-wrap:anywhere;
}
.dialog-head .btn {
  flex-shrink:0;
  min-width:44px;
  min-height:44px;
}
.dialog-body .form-actions {
  position:sticky;
  bottom:-28px;
  z-index:1;
  background:var(--white);
  padding:16px 0;
  box-shadow:0 -8px 16px #fffbf4e6;
}
.dialog-body input,.dialog-body select,.dialog-body textarea,.dialog-body button {
  scroll-margin-block:100px 110px;
}
@media(max-width:760px) {
  .sidebar {
    padding-top:24px;
    height:100dvh;
  }
  .topbar {
    gap:10px;
  }
  .stat strong {
    font-size:clamp(1.1rem,4vw,1.4rem);
  }
  .toolbar input,.toolbar select {
    min-width:0;
    flex:1 1 180px;
  }
  .btn.small {
    min-height:44px;
  }
  .dialog-head {
    gap:12px;
  }
  .dialog-body .form-actions {
    bottom:-18px;
    padding-bottom:max(14px,env(safe-area-inset-bottom));
  }
  .login-form {
    padding:24px 20px;
  }
  .login-main {
    padding:24px 16px;
  }
  .preview {
    padding:18px;
  }
  .total-card {
    padding:18px 24px;
  }
  .extras .extra-row {
    grid-template-columns:1fr;
  }
}
@media(max-width:380px) {
  .stats {
    grid-template-columns:1fr;
  }
  .stat {
    display:flex;
    align-items:center;
    gap:10px;
  }
  .stat span {
    margin:0;
  }
  .extra-row {
    grid-template-columns:minmax(0,1fr) 90px;
  }
  .extra-row .btn {
    grid-column:1/-1;
    justify-self:start;
  }
  #list-results tbody tr {
    grid-template-columns:1fr;
  }
}
@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    animation:none!important;
    transition:none!important;
    scroll-behavior:auto!important;
  }
}
@media print {
  :root {
    --white:#fff;
    --bg:#fff;
    --ink:#000;
    --muted:#444;
    --line:#aaa;
  }
  .preview,.panel,.stat,.total-card,.line-editor {
    background:white;
    box-shadow:none;
  }
  .total-card::before {
    display:none;
  }
  .money,.total-card strong {
    color:#000;
  }
}

/* Arkan Makkah original logo: self-contained PNG, no external request. */
.brand {
  flex-wrap:wrap;
}
.brand-mark {
  width:100%;
  height:72px;
  flex:0 0 100%;
  padding:10px;
  border:1px solid var(--line);
  border-radius:5px;
  background-color:var(--white);
  background-repeat:no-repeat;
  background-position:center;
  background-size:calc(100% - 20px) auto;
  font-size:0;
  color:transparent;
  text-shadow:none;
}
.brand-mark > * {
  visibility:hidden;
}
.login-aside .brand {
  width:100%;
  max-width:380px;
}
.login-aside .brand-mark {
  height:112px;
}

    height:90px;
  }

.quick-modes button[aria-pressed="true"]{background:var(--teal);color:#fff;font-weight:700}
.quick-modes button:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
.quick-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,.85fr);gap:20px;align-items:start}
.quick-inputs{padding:18px}
.quick-two{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.quick-strip label,.quick-extra label{margin-bottom:12px}
.quick-extra{border:1px solid var(--line);border-radius:12px;padding:13px 15px;background:#fcfafb;margin-top:6px}
.quick-extra>summary{font-size:.87rem;color:var(--teal);font-weight:500;cursor:pointer;min-height:34px;display:flex;align-items:center}
.quick-extra-body{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
.quick-results{position:sticky;top:14px}
.quick-card{border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:9px;background:#fff}
.quick-card-label{display:block;font-size:.8rem;color:var(--muted)}
.quick-card strong{display:block;font-size:1.55rem;font-weight:800;line-height:1.4}
.quick-card small{display:block;font-size:.77rem;color:var(--muted)}
.quick-card.lead{background:var(--teal-soft);border-color:var(--teal)}
.quick-card.lead .quick-card-label,.quick-card.lead strong,.quick-card.lead small{color:var(--teal)}
.quick-card.lead strong{font-size:2rem}
.quick-card.below{border-color:var(--red)}
.quick-card.below small{color:var(--red)}
.quick-actions{display:flex;gap:9px;margin-top:12px}
.quick-actions .btn{flex:1;margin:0}
.quick-layout.mode-compact .quick-card strong{font-size:1.18rem}
.quick-layout.mode-compact .quick-card.lead strong{font-size:1.35rem}
.quick-layout.mode-compact .quick-card{padding:9px 12px;margin-bottom:6px}
.quick-layout.mode-compact .quick-card small{display:none}
.quick-layout.mode-guided .quick-two{grid-template-columns:minmax(0,1fr)}
.quick-layout.mode-guided .quick-inputs label{margin-bottom:16px}
#quick-form [data-step][hidden]{display:none!important}
/* Phones: a frozen first column and honest horizontal scrolling beat a nine-column squeeze. */
.compare-wrap{position:relative}
.scroll-hint{font-size:.76rem;color:var(--muted);margin:0 0 7px;display:none}
@media(max-width:900px){
 .scroll-hint{display:block}
 .compare-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
 .compare-table{min-width:max-content}
 .compare-table th:first-child,.compare-table td:first-child{position:sticky;inset-inline-start:0;z-index:2;background:#fff;border-inline-end:2px solid var(--line);min-width:150px;max-width:190px;white-space:normal}
 .compare-table th:first-child{z-index:3;background:#f7f4f6}
 .compare-table th,.compare-table td{padding-inline:11px}
}
@media(max-width:760px){
 .quick-layout{grid-template-columns:minmax(0,1fr)}
 .quick-results{position:static}
 .quick-inputs{padding:14px}
 .quick-modes{display:flex;width:100%}
 .quick-modes button{flex:1;padding:9px 6px}
 .quick-card.lead strong{font-size:1.75rem}
 .quick-actions{position:sticky;bottom:0;background:#fffffff5;backdrop-filter:blur(10px);padding:10px 0;margin:0}
 .switch-group{padding:11px 12px}
}

/* ===== Release 5 — hotel cards, negotiation, presets, share card, phone offers table ===== */
.hotel-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-bottom:14px}
.hotel-card{border:1px solid var(--line);border-radius:12px;background:#fcfafb;padding:13px 15px}
.hotel-card-head{display:flex;justify-content:space-between;align-items:center;gap:9px;margin-bottom:11px}
.hotel-card-head b{font-size:.93rem;color:var(--teal)}
.hotel-card-head span{font-size:.73rem;color:var(--muted)}
.hotel-card.is-off{background:#f6f2f4}
.hotel-card.is-off .hotel-card-head b{color:var(--muted)}
.hotel-card .grid{margin:0}
.quick-strip .hint{font-size:.78rem;color:var(--muted);margin-top:-4px}
.preset-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:9px;margin-bottom:16px}
.preset{position:relative;border:1px solid var(--line);border-radius:12px;background:#fff;padding:11px 13px;text-align:start;cursor:pointer;min-height:66px}
.preset:hover{border-color:var(--teal)}
.preset b{display:block;font-size:.87rem;color:var(--teal)}
.preset small{display:block;font-size:.73rem;color:var(--muted);margin-top:2px}
.preset .num{position:absolute;inset-block-start:11px;inset-inline-end:13px;font-size:.87rem;font-weight:800}
.preset i{position:absolute;inset-block-end:8px;inset-inline-end:10px;font-style:normal;font-size:.76rem;color:var(--muted);cursor:pointer;padding:3px 6px;border-radius:6px}
.preset i:hover{background:#f4e9ec;color:var(--red)}
.preset-add{border-style:dashed;color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:.83rem}
.floor-line{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:#fdf4f5;border:1px solid #f0d3d8;border-radius:11px;padding:10px 13px;margin-top:12px;font-size:.83rem;color:#9d3b4e}
.floor-line input{width:72px;text-align:center;padding:6px}
.chips-inline{display:flex;gap:6px;flex-wrap:wrap;margin-inline-start:auto}
.chips-inline .chip{min-height:34px;padding:5px 12px;font-size:.78rem}
.neg-row{border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px 14px;margin-bottom:10px}
.neg-head{display:grid;grid-template-columns:1.15fr 1.1fr .9fr;gap:10px;align-items:center}
.neg-name{font-size:.89rem;color:var(--muted)}
.neg-name small{display:block;font-size:.73rem;margin-top:2px}
.neg-head input{width:100%;text-align:center;font-size:1.05rem;font-weight:800;padding:7px}
.neg-profit{text-align:end;font-size:.95rem;font-weight:800;color:#2f7a52}
.neg-profit small{display:block;font-size:.72rem;font-weight:500}
.neg-row.is-low .neg-profit{color:#a8761f}
.neg-row.is-bad .neg-profit{color:var(--red)}
.neg-row.is-bad{border-color:var(--red)}
.neg-bar{height:7px;border-radius:4px;background:#ece5e8;margin-top:11px;position:relative;overflow:hidden}
.neg-bar i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:4px;background:#3f8f68}
.neg-row.is-low .neg-bar i{background:#d4a03a}
.neg-row.is-bad .neg-bar i{background:var(--red)}
.neg-bar u{position:absolute;inset-block:-3px;width:2px;background:#9d3b4e;text-decoration:none}
.neg-scale{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted);margin-top:4px}
.neg-advice{margin-top:10px;background:#fdf4f5;border-radius:9px;padding:9px 11px;font-size:.79rem;color:#9d3b4e;line-height:1.8}
.neg-advice .btn{margin:6px 0 0}
.cust-view{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
.cust-row{display:flex;justify-content:space-between;align-items:baseline;padding:14px 16px;border-top:1px solid var(--line)}
.cust-row:first-child{border-top:0}
.cust-row b{font-size:1.5rem;font-weight:800;color:var(--teal)}
.share-card img{width:100%;border-radius:12px;border:1px solid var(--line)}
.quick-shortcut{margin:0 0 0 10px;background:var(--teal);color:#fff;border-color:var(--teal);min-height:38px;padding:7px 14px;font-size:.83rem;font-weight:700;white-space:nowrap}
.quick-shortcut:hover{background:#5a2329;color:#fff}
.quick-shortcut.is-active{background:var(--gold);border-color:var(--gold)}
.room-chips{margin-bottom:11px}
.narrow-table{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
.narrow-head,.narrow-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:11px 13px}
.narrow-head{background:#f7f4f6;font-size:.75rem;color:var(--muted);border-bottom:1px solid var(--line)}
.narrow-row{border-top:1px solid var(--line)}
.narrow-row:first-of-type{border-top:0}
.narrow-row.is-archived{opacity:.66}
.narrow-main b{display:block;font-size:.9rem;line-height:1.5}
.narrow-main small{display:block;font-size:.73rem;color:var(--muted);margin-top:2px}
.narrow-price .num{font-size:1.05rem;font-weight:800;white-space:nowrap}
@media(max-width:760px){
 .hotel-cards{grid-template-columns:minmax(0,1fr);gap:10px}
 .preset-row{grid-template-columns:minmax(0,1fr)}
 .neg-head{grid-template-columns:1fr 1fr;row-gap:8px}
 .neg-profit{grid-column:2}
 .neg-name{grid-column:1}
 .neg-head>span:nth-child(2){grid-column:1/-1;order:3}
 .floor-line{font-size:.79rem}
 .chips-inline{margin-inline-start:0;width:100%}
 .chips-inline .chip{flex:1}
 .quick-shortcut{padding:7px 11px;font-size:.78rem;margin-inline-start:8px}
 .cust-row b{font-size:1.3rem}
}

/* ===== Release 6 — saving state, extras toggle, floor switch, delete dialog, phone actions ===== */
.btn.is-busy{opacity:.75;cursor:progress}
.quick-extra>summary{display:flex;align-items:center;justify-content:space-between;gap:10px;list-style:none}
.quick-extra>summary::-webkit-details-marker{display:none}
.ex-title b{display:block;font-size:.88rem;color:var(--ink)}
.ex-title small{display:block;font-size:.75rem;color:var(--muted);margin-top:2px}
.ex-side{display:flex;align-items:center;gap:9px;flex:none}
.ex-side b{font-size:.84rem;white-space:nowrap}
.ex-label{font-size:.78rem;color:var(--teal);white-space:nowrap}
.ex-arrow{font-size:1rem;color:var(--muted);transition:transform .18s}
.quick-extra[open] .ex-arrow{transform:rotate(180deg)}
.floor-switch{display:inline-flex;border:1px solid #e2c3c9;border-radius:8px;overflow:hidden}
.floor-switch button{border:0;background:#fff;color:#9d3b4e;padding:5px 11px;font-size:.76rem;min-height:32px;cursor:pointer}
.floor-switch button+button{border-inline-start:1px solid #e2c3c9}
.floor-switch button[aria-pressed="true"]{background:#9d3b4e;color:#fff;font-weight:700}
.usage-warn ul{margin:8px 0 10px;padding-inline-start:20px;font-size:.9rem;line-height:2}
.usage-warn p{font-size:.92rem}
@media(max-width:760px){
 .quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:static;background:none;backdrop-filter:none;padding:0}
 .quick-actions .btn{margin:0;min-height:46px}
 .quick-actions .btn:nth-child(n+3){display:none}
 .quick-actions.show-all .btn:nth-child(n+3){display:block}
 .quick-more{grid-column:1/-1;border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:10px;min-height:42px;font-size:.83rem;cursor:pointer}
 .floor-line{font-size:.78rem}
 .floor-switch{margin-inline-start:auto}
 .ex-side .ex-label{display:none}
}

/* ===== Release 7 — build mismatch notice ===== */
.build-notice{border:1px solid var(--red);background:#fbecee;border-radius:12px;padding:13px 15px;margin-bottom:16px}
.build-notice b{display:block;font-size:.92rem;color:var(--red);margin-bottom:4px}
.build-notice p{font-size:.85rem;line-height:1.8;color:var(--ink);margin:0}

/* ===== Release 8 — performance readout ===== */
.perf-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.perf-stat{border:1px solid var(--line);border-radius:11px;background:#fcfafb;padding:11px 13px}
.perf-stat span{display:block;font-size:.77rem;color:var(--muted)}
.perf-stat strong{font-size:1.3rem;font-weight:800}

/* ---- Madinah: always visible, always editable. Nights decide inclusion, so a record saved
   with the old flag off opens at zero nights and keeps exactly the price it had. ---- */
function proMadinahFromNights(input){
  const nights=Number(input.madinahNights||0);
  return {...input,madinahNights:nights,includeMadinah:nights>0};
}
function proNormaliseStored(input){
  if(!input)return input;
  return input.includeMadinah===true?input:{...input,madinahNights:0};
}
function proHotelCard(title,badge,fields){
  return `<section class="hotel-card"><div class="hotel-card-head"><b>${c(title)}</b><span>${c(badge)}</span></div><div class="grid three">${fields}</div></section>`;
}
function proRestructureHotels(form){
  // The two forms name the block differently and place the old checkbox differently, so the
  // rebuild works from the fields themselves rather than from a fixed DOM shape.
  if(!form||form.querySelector('.hotel-card'))return;
  const madinah=form.querySelector('#madinah-inputs,#cp-madinah');
  const makkahGrid=form.querySelector('[name=makkahNights]')?.closest('.grid');
  if(!madinah||!makkahGrid||makkahGrid===madinah)return;
  const wrap=document.createElement('div');
  wrap.className='hotel-cards';
  makkahGrid.parentNode.insertBefore(wrap,makkahGrid);
  const card=(title,badge,node)=>{
    const section=document.createElement('section');
    section.className='hotel-card';
    section.innerHTML=`<div class="hotel-card-head"><b>${c(title)}</b><span>${c(badge)}</span></div>`;
    section.appendChild(node);
    wrap.appendChild(section);
  };
  card('فندق مكة','أساسي',makkahGrid);
  card('فندق المدينة','اتركه صفراً إن لم يكن مشمولاً',madinah);
  madinah.hidden=false;
  // The checkbox stays a real checkbox (FormData only reports it when checked) but is hidden;
  // its state is derived from the nights field on every keystroke.
  const box=form.querySelector('[name=includeMadinah]');
  if(box){
    box.closest('label')?.setAttribute('hidden','');
    box.closest('.check-group')?.setAttribute('hidden','');
  }
  proSyncMadinah(form);
}
function proSyncMadinah(form){
  const field=form.querySelector('[name=madinahNights],[name=q-madinahNights]');
  const nights=Number(field?.value||0);
  const box=form.querySelector('[name=includeMadinah]');
  if(box)box.checked=nights>0;
  (field?.closest('.hotel-card')||form.querySelector('#madinah-inputs,#cp-madinah')?.closest('.hotel-card'))?.classList.toggle('is-off',nights<=0);
}

function proQuickFloor(cost){return proQuickFloorOf(cost);}
function proNegotiateRows(view){
  const rows=view.result.results||[];
  if(!rows.length)return '<div class="live-error">لا توجد أنواع غرف معرّفة.</div>';
  const hotels=proQuickDefs('hotel');
  const current=Number(d('[name=q-makkahRate]')?.value||0);
  return rows.map((row,index)=>{
    const cost=row.baseCost,list=row.sell;
    const sell=proQuickExtra.sells[index]!=null?proQuickExtra.sells[index]:list;
    const profit=sell-cost,pct=cost>0?Math.round(profit/cost*100):0;
    const floor=proQuickFloor(cost);
    const span=Math.max(list*1.12-cost,1);
    const fill=Math.max(0,Math.min(100,(sell-cost)/span*100));
    const mark=Math.max(0,Math.min(100,(floor-cost)/span*100));
    const state=sell<cost?'bad':sell<floor?'low':'';
    let advice='';
    if(sell<floor){
      const cheaper=hotels.filter(hotel=>Number(hotel.rate)<current).sort((a,x)=>x.rate-a.rate)
        .find(hotel=>{
          const saved=(current-Number(hotel.rate))*Number(d('[name=q-makkahNights]')?.value||0)/(row.count||1)/Number(d('[name=q-sarPerUsd]')?.value||3.75)*Number(d('[name=q-usdToLyd]')?.value||4.85);
          return sell>=proQuickFloor(cost-saved);
        });
      advice=cheaper
        ? `<div class="neg-advice">تحت حدّك الأدنى (<b>${ne(floor)}</b>). بدل خفض ربحك: <b>${c(cheaper.name)}</b> يبقيك فوق الحد بهذا السعر. <button type="button" class="btn small" data-pro="quick-swap" data-value="${c(cheaper.id)}">حوّل إليه</button></div>`
        : `<div class="neg-advice">تحت حدّك الأدنى (<b>${ne(floor)}</b>)، ولا يوجد فندق أرخص يحقق هذا السعر بربحك.</div>`;
    }
    return `<div class="neg-row${state?' is-'+state:''}"><div class="neg-head"><span class="neg-name">${c(row.label)}<small>تكلفة ${ne(cost)}</small></span><span><input type="number" data-neg="${index}" value="${Math.round(sell)}" step="5" aria-label="سعر بيع ${c(row.label)}"></span><span class="neg-profit">${profit<0?'−':'+'}${ne(Math.abs(profit))}<small>${pct}٪</small></span></div><div class="neg-bar"><i style="width:${fill}%"></i><u style="inset-inline-start:${mark}%"></u></div><div class="neg-scale"><span>${ne(cost)}</span><span>المعلن ${ne(list)}</span></div>${advice}</div>`;
  }).join('');
}

function proDrawShareCard(view){
  return new Promise(resolve=>{
    const lines=proShareLines(view);

    const H=headH+rowH*lines.length+footH;
    const canvas=document.createElement('canvas');
    canvas.width=W;canvas.height=H;
    const ctx=canvas.getContext('2d');
    const ink='#2b2023',teal='#461a1f',paper='#f4ebdd',surface='#fffbf4',gold='#b88a44',muted='#75646a';
    ctx.fillStyle=paper;ctx.fillRect(0,0,W,H);
    ctx.fillStyle=teal;ctx.fillRect(0,0,W,headH);
    ctx.fillStyle=gold;ctx.fillRect(0,headH-8,W,8);
    const body=()=>{

      lines.forEach((line,index)=>{
        const y=headH+40+rowH*index;

        ctx.fillText(line.label,W-pad-32,y+58);
        ctx.fillStyle=ink;ctx.textAlign='left';
        ctx.font='700 42px Tajawal, Tahoma, sans-serif';
        ctx.fillText(line.value,pad+32,y+58);
        ctx.textAlign='right';
      });
      const fy=headH+rowH*lines.length+46;
      ctx.fillStyle=muted;
      ctx.font='400 26px Tajawal, Tahoma, sans-serif';
      ctx.fillText('السعر للفرد بالدينار الليبي',W-pad,fy);
      const until=new Date(Date.now()+14*864e5).toLocaleDateString('ar-LY');
      ctx.fillText('هذا السعر ساري حتى '+until,W-pad,fy+42);
      if(s.boot?.company?.contact||s.boot?.settings?.contact)ctx.fillText(String(s.boot.company?.contact||s.boot.settings.contact),W-pad,fy+84);
      canvas.toBlob(blob=>resolve({blob,url:canvas.toDataURL('image/png')}),'image/png');
    };
    const logo=new Image();
    logo.onload=()=>{
      // The logo artwork is dark on transparency, so it needs a light panel under it or it
      // disappears into the maroon header.
      const h=88,w=logo.width/logo.height*h,inset=18;
      const panelW=w+inset*2,panelH=h+inset*2,x=pad,y=36,r=18;
      ctx.fillStyle=surface;
      ctx.beginPath();
      ctx.moveTo(x+r,y);
      ctx.lineTo(x+panelW-r,y);ctx.quadraticCurveTo(x+panelW,y,x+panelW,y+r);
      ctx.lineTo(x+panelW,y+panelH-r);ctx.quadraticCurveTo(x+panelW,y+panelH,x+panelW-r,y+panelH);
      ctx.lineTo(x+r,y+panelH);ctx.quadraticCurveTo(x,y+panelH,x,y+panelH-r);
      ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
      ctx.closePath();ctx.fill();
      ctx.drawImage(logo,x+inset,y+inset,w,h);
      body();
    };
    logo.onerror=body;
    logo.src=Ke;
  });
}

/* ===== Release 6 ===== Merge the saved record instead of reloading everything. */
const proR6={after:N,observe:proObserveApi};
let proLastSave=null;
/* Which boot list each save writes into. Anything absent falls back to a full reload, and the
   three below are excluded on purpose because one call changes many records at once. */
const proMergeTargets={
  'definition.save':'definitions','company.save':'companies','user.save':'users',
  'pricing.save':'pricings','offer.save':'offers','offer.approve':'offers','offer.archive':'offers',
  'quote.save':'quotes','quote.archive':'quotes','settings.save':'settings',
  'company.pricing.save':'companyPricings','company.pricing.archive':'companyPricings',
  'assignment.toggle':'assignments'
};
const proFullReloadActions=['publish.commit','definition.import','account.password'];
proObserveApi=function(action,data){
  if(proMergeTargets[action]&&!proFullReloadActions.includes(action))proLastSave={action,data};
  return proR6.observe(action,data);
};
N=async function(message){
  const save=proLastSave;proLastSave=null;
  const table=save&&proMergeTargets[save.action];
  if(!table||!save.data)return proR6.after(message);
  if(table!=='settings'&&!save.data.id)return proR6.after(message);
  oe();
  if(table==='settings')s.boot.settings={...s.boot.settings,...save.data};
  else{
    const list=(s.boot[table]||[]).slice();
    const index=list.findIndex(row=>row.id===save.data.id);
    if(index>=0)list[index]=save.data;else list.unshift(save.data);
    s.boot[table]=list;
  }
  gi();
  q(message);
};
/* A visible saving state, and no second submit while the first is still in flight. */
document.addEventListener('submit',event=>{
  const button=event.target.querySelector('[type=submit]');
  if(!button||button.dataset.proBusy)return;
  const label=button.textContent;
  button.dataset.proBusy='1';
  button.textContent=event.target.id==='login'?'جارٍ الدخول…'
    :/مراجعة|احسب/.test(label)?'جارٍ الحساب…'
    :'جارٍ الحفظ…';
  button.classList.add('is-busy');
  const restore=()=>{
    button.textContent=label;
    button.classList.remove('is-busy');
    delete button.dataset.proBusy;
  };
  setTimeout(function check(){
    if(button.disabled){setTimeout(check,60);return;}
    restore();
  },60);
},true);

    const links=[['تسعيرة',usage.pricings],['مسودة سريعة',usage.quickDrafts],['عرض',usage.offers],['تخصيص شركة',usage.assignments]].filter(([,count])=>count>0);

/* ===== Release 8 ===== Measure each request so the split between network and server is visible. */
const proTimings=[];
const proR8Api=v;
v=async function(action,payload={},requestId){
  const started=Date.now();
  const before=proLastMeta;
  try{
    return await proR8Api(action,payload,requestId);
  }finally{
    const total=Date.now()-started;
    const meta=proLastMeta!==before?proLastMeta:null;
    proTimings.unshift({action,total,server:meta?meta.ms:null,read:meta?meta.read:null,write:meta?meta.write:null,lock:meta?meta.lock:null,tables:meta?meta.tables:null,at:Date.now()});
    proTimings.length=Math.min(proTimings.length,25);
  }
};
function proPerfPanel(){
  if(proTimings.length===0)return '<p class="hint">لم تُسجَّل عمليات بعد. استخدم المنظومة قليلاً ثم عد إلى هنا.</p>';
  const withServer=proTimings.filter(row=>row.server!=null);
  const avg=list=>list.length?Math.round(list.reduce((a,b)=>a+b,0)/list.length):0;
  const totalAvg=avg(withServer.map(row=>row.total));
  const serverAvg=avg(withServer.map(row=>row.server));
  const networkAvg=Math.max(0,totalAvg-serverAvg);
  const verdict=!withServer.length?'الخادم لا يرسل قياساً — ارفع Apps Script.'
    :networkAvg>serverAvg*1.5?'أغلب الوقت في الاتصال، لا في الخادم. جرّب شبكة أخرى.'
    :serverAvg>networkAvg*1.5?'أغلب الوقت داخل الخادم، لا في اتصالك.'
    :'الوقت موزّع بين الاتصال والخادم بالتساوي تقريباً.';
  return `<div class="perf-summary"><div class="perf-stat"><span>متوسط العملية</span><strong>${totalAvg} م.ث</strong></div><div class="perf-stat"><span>داخل الخادم</span><strong>${serverAvg} م.ث</strong></div><div class="perf-stat"><span>الاتصال والتوجيه</span><strong>${networkAvg} م.ث</strong></div></div><p class="hint">${c(verdict)}</p>`+
    M(['العملية','الإجمالي','الخادم','قراءة Sheets','كتابة Sheets','انتظار القفل'],proTimings.slice(0,12).map(row=>R([
      c(row.action),row.total+' م.ث',row.server==null?'—':row.server+' م.ث',
      row.read==null?'—':row.read+' م.ث'+(row.tables?' · '+row.tables+' جداول':''),
      row.write==null?'—':row.write+' م.ث',row.lock==null?'—':row.lock+' م.ث'
    ])));
}

  proUpgradeActions();
};
const proR8Action=Ri;
Ri=async function(action,id,el){
  if(action==='perf.refresh'){d('#pro-perf')?.remove();Pi();return;}

};
