
<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><meta name="description" content="منظومة تسعير الرحلات والخدمات وعروض الشركات"><title>رحلة | التسعير والعروض</title><style>/*
 * Rihla — warm travel-paper visual theme.
 * Arkan Makkah: original supplied logo embedded; sampled burgundy #461A1F.
 * All original selectors and custom-property names are preserved.
 * Original uploaded PNG bytes are embedded without modifying the artwork.
 */
:root {
  --ink:#2b2023;
  --muted:#75646a;
  --navy:#32171d;
  --teal:#461a1f;
  --teal-soft:#eee2cf;
  --line:#d9cbb8;
  --bg:#f4ebdd;
  --white:#fffbf4;
  --gold:#b88a44;
  --red:#9a3632;
  --radius:8px;
  font-family:Tahoma,"Segoe UI",Arial,sans-serif;
  font-size:16px;
  color:var(--ink);
  background:var(--bg);
  --paper:#f4ebdd;
  --surface:#fffbf4;
  --olive:#526247;
  --focus:#461a1f;
  line-height:1.7;
  color-scheme:light;
}
* {
  box-sizing:border-box;
}
body {
  margin:0;
  direction:rtl;
  min-width:0;
  background:var(--bg);
  text-rendering:optimizeLegibility;
}
button,input,select,textarea {
  font:inherit;
}
button {
  cursor:pointer;
}
button:disabled {
  cursor:not-allowed;
  opacity:.55;
}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible {
  outline:3px solid var(--focus);
  outline-offset:3px;
}
input,select,textarea {
  width:100%;
  min-width:0;
  border:1px solid #b6a58f;
  border-radius:5px;
  padding:11px 13px;
  background:var(--white);
  color:var(--ink);
  min-height:46px;
  line-height:1.6;
  transition:border-color .15s ease,box-shadow .15s ease;
}
input[type=checkbox] {
  width:20px;
  height:20px;
  accent-color:var(--teal);
  flex:none;
  min-height:20px;
  padding:0;
}
input[type=number] {
  direction:ltr;
  text-align:right;
}
textarea {
  min-height:100px;
  resize:vertical;
  line-height:1.8;
}
label {
  display:flex;
  flex-direction:column;
  gap:8px;
  font-size:.875rem;
  font-weight:700;
  line-height:1.7;
  min-width:0;
}
h1,h2,h3,p {
  margin:0;
}
h1 {
  font-size:clamp(1.5rem,2.3vw,2rem);
  line-height:1.55;
}
h2 {
  font-size:1.3rem;
  line-height:1.65;
}
h3 {
  font-size:1rem;
  line-height:1.7;
}
p {
  line-height:1.9;
}
small,.muted {
  color:var(--muted);
}
small {
  font-size:.875rem;
  line-height:1.7;
}
a {
  color:var(--teal);
  text-underline-offset:4px;
}
.num {
  font-variant-numeric:tabular-nums;
  direction:ltr;
  display:inline-block;
  font-family:Arial,sans-serif;
  unicode-bidi:isolate;
}
.loading,.empty {
  padding:64px 24px;
  text-align:center;
  color:var(--muted);
  line-height:2;
  background:var(--white);
}
.empty strong {
  display:block;
  color:var(--ink);
  font-size:1.1rem;
}
.btn {
  border:1px solid var(--line);
  background:var(--white);
  color:var(--ink);
  border-radius:5px;
  min-height:44px;
  padding:10px 18px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  font-weight:700;
  font-size:.875rem;
  line-height:1.5;
  border-color:#b6a58f;
  transition:background-color .15s ease,border-color .15s ease,box-shadow .15s ease;
  text-decoration:none;
  max-width:100%;
  white-space:normal;
}
.btn:hover {
  background:#eee2cf;
  border-color:var(--teal);
}
.btn.primary {
  background:var(--teal);
  color:var(--white);
  border-color:var(--teal);
  box-shadow:inset 0 1px 0 #ffffff18;
}
.btn.primary:hover {
  background:#351218;
}
.btn.danger {
  color:var(--red);
  border-color:#dab8b0;
  background:#fff8f3;
}
.btn.small {
  min-height:38px;
  padding:7px 11px;
}
.btn.ghost {
  background:transparent;
  border-color:transparent;
}
.shell {
  display:grid;
  grid-template-columns:256px minmax(0,1fr);
  min-height:100vh;
}
.sidebar {
  background:linear-gradient(160deg,#48262e,var(--navy) 65%);
  color:var(--white);
  padding:32px 18px 22px;
  display:flex;
  flex-direction:column;
  gap:32px;
  position:sticky;
  top:0;
  height:100dvh;
  overflow-y:auto;
  border-inline-end:1px solid #79505a;
  scrollbar-width:thin;
}
.brand {
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 10px;
  min-width:0;
}
.brand-mark {
  width:52px;
  height:52px;
  display:grid;
  place-items:center;
  background:#542b35;
  border-radius:6px;
  font-size:1.45rem;
  font-weight:bold;
  flex:none;
  border:1px solid var(--gold);
  color:#f3e5c8;
}
.brand strong {
  font-size:1.45rem;
  line-height:1.6;
}
.brand small {
  color:#ead9d6;
  display:block;
  font-size:.75rem;
  line-height:1.8;
}
.nav {
  display:grid;
  gap:9px;
}
.nav button {
  text-align:right;
  background:none;
  border:1px solid transparent;
  color:#eee2cf;
  border-radius:5px;
  padding:12px 14px;
  font-size:1rem;
  font-weight:bold;
  display:flex;
  align-items:center;
  gap:12px;
  min-height:48px;
  line-height:1.7;
  transition:background-color .15s ease;
}
.nav button:hover {
  background:#542b35;
}
.nav button.active {
  background:#f4ebdd;
  color:#351218;
  border-color:#d9cbb8;
  box-shadow:inset -4px 0 0 var(--gold);
}
.nav svg {
  width:20px;
  height:20px;
  flex:none;
}
.sidebar-bottom {
  margin-top:auto;
  border-top:1px dashed #a67983;
  padding-top:20px;
}
.sidebar-bottom small {
  color:#ead9d6;
}
.sidebar-bottom .btn {
  color:var(--white);
  border-color:#a67983;
  margin-top:12px;
  background:transparent;
}
.workspace {
  min-width:0;
}
.topbar {
  min-height:86px;
  border-bottom:1px solid var(--line);
  background:var(--white);
  padding:18px 36px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
}
.topbar .organization {
  font-size:.875rem;
  color:var(--muted);
}
.user-chip {
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:bold;
  font-size:.875rem;
  min-width:0;
  flex-wrap:wrap;
}
.avatar {
  width:40px;
  height:40px;
  border-radius:7px;
  display:grid;
  place-items:center;
  background:#f3e5c8;
  color:var(--teal);
  flex:none;
  border:1px solid #c9ad79;
}
.main {
  padding:36px 36px 56px;
  max-width:1600px;
  margin:auto;
}
.page-head {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  margin-bottom:28px;
  flex-wrap:wrap;
}
.page-head p {
  margin-top:6px;
  color:var(--muted);
  font-size:.95rem;
}
.eyebrow {
  font-size:.8rem;
  color:var(--teal);
  font-weight:bold;
  margin-bottom:5px;
  line-height:1.8;
}
.stats {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
  margin-bottom:28px;
}
.stat {
  background:var(--white);
  border:1px solid var(--line);
  border-radius:3px;
  padding:22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  border-top:3px solid var(--gold);
  min-width:0;
  flex-wrap:wrap;
  box-shadow:none;
}
.stat strong {
  font-size:1.85rem;
  line-height:1.4;
  font-variant-numeric:tabular-nums;
  overflow-wrap:anywhere;
}
.stat span {
  color:var(--muted);
  font-size:.875rem;
}
.panel {
  background:var(--white);
  border:1px solid var(--line);
  border-radius:8px;
  overflow:hidden;
  box-shadow:none;
}
.panel-pad {
  padding:28px;
}
.toolbar {
  padding:18px 22px;
  display:flex;
  gap:14px;
  align-items:center;
  border-bottom:1px solid var(--line);
  flex-wrap:wrap;
  background:#f8f1e6;
}
.toolbar input {
  max-width:340px;
}
.toolbar select {
  width:auto;
  min-width:140px;
  max-width:100%;
}
.table-wrap {
  overflow-x:auto;
  max-width:100%;
  overscroll-behavior-x:contain;
  scrollbar-color:#b6a58f #f4ebdd;
  scrollbar-width:thin;
}
table {
  border-collapse:collapse;
  width:100%;
  text-align:right;
  font-size:.875rem;
  line-height:1.8;
  font-variant-numeric:tabular-nums;
}
th {
  background:#eee2cf;
  color:var(--ink);
  font-weight:700;
  white-space:nowrap;
  font-size:.8125rem;
  padding-block:14px;
}
td,th {
  padding:16px 20px;
  border-bottom:1px solid var(--line);
  vertical-align:middle;
}
td {
  overflow-wrap:anywhere;
}
tbody tr:last-child td {
  border-bottom:0;
}
tbody tr:hover {
  background:#f4ebdd;
}
.table-title {
  font-size:.95rem;
  font-weight:bold;
  color:var(--ink);
  display:block;
  min-width:140px;
}
.actions {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  min-width:120px;
}
.badge {
  border-radius:3px;
  background:#eee2cf;
  color:#75646a;
  padding:3px 9px;
  display:inline-block;
  white-space:nowrap;
  font-size:.8rem;
  font-weight:bold;
  border:1px solid #d9cbb8;
  line-height:1.8;
}
.badge.ok {
  background:#e9eddf;
  color:#526247;
  border-color:#bdc9ad;
}
.badge.gold {
  background:#f3e5c8;
  color:#461a1f;
  border-color:#c9ad79;
}
.badge.danger {
  background:#f6e7e1;
  color:#9a3632;
  border-color:#dab8b0;
}
.money {
  font-size:1.08rem;
  font-weight:bold;
  color:var(--teal);
  white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
.hint {
  background:#f4ebdd;
  border:1px solid #d9cbb8;
  border-radius:5px;
  padding:14px 16px;
  color:#461a1f;
  line-height:1.9;
  font-size:.875rem;
  border-inline-start:3px solid var(--gold);
}
.hint.warn {
  background:#f3e5c8;
  border-color:#c9ad79;
  color:#461a1f;
  border-inline-start-color:var(--gold);
}
.hint.error {
  background:#f6e7e1;
  border-color:#dab8b0;
  color:var(--red);
  border-inline-start-color:var(--red);
}
.section {
  margin-top:28px;
}
.section-title {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:16px;
  gap:12px;
  flex-wrap:wrap;
}
.grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:20px;
}
.grid.three {
  grid-template-columns:repeat(3,minmax(0,1fr));
}
.grid.four {
  grid-template-columns:repeat(4,minmax(0,1fr));
}
.full {
  grid-column:1/-1;
}
.check {
  flex-direction:row;
  align-items:center;
  font-weight:normal;
  gap:10px;
  min-height:44px;
  cursor:pointer;
}
.check-group {
  display:flex;
  flex-wrap:wrap;
  gap:12px 22px;
  padding:12px 0;
}
.form-actions {
  display:flex;
  gap:10px;
  justify-content:flex-end;
  padding-top:22px;
  margin-top:26px;
  border-top:1px dashed #b6a58f;
  flex-wrap:wrap;
}
.inline {
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
}
.split {
  display:flex;
  justify-content:space-between;
  gap:16px;
  align-items:center;
  flex-wrap:wrap;
}
.divider {
  height:1px;
  background:var(--line);
  margin:26px 0;
}
.result {
  margin-top:22px;
}
.result table input {
  min-width:100px;
}
.total-card {
  padding:22px 24px;
  background:#eee2cf;
  border-radius:4px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  border:1px solid #c9ad79;
  border-inline-start:5px solid var(--gold);
  position:relative;
  flex-wrap:wrap;
}
.total-card strong {
  font-size:1.9rem;
  color:var(--teal);
  line-height:1.45;
  font-variant-numeric:tabular-nums;
  overflow-wrap:anywhere;
}
.line-editor {
  border:1px solid var(--line);
  border-radius:6px;
  padding:22px;
  margin-bottom:16px;
  background:var(--white);
  border-inline-start:3px solid #c9ad79;
}
.line-editor h3 {
  line-height:1.8;
}
.line-editor .grid {
  margin-top:16px;
}
.line-editor .source-price {
  color:var(--teal);
  font-size:.875rem;
  margin-top:8px;
}
.extra-row {
  display:grid;
  grid-template-columns:minmax(0,1fr) 140px auto;
  gap:8px;
  margin-bottom:8px;
  align-items:end;
}
.preview {
  line-height:1.9;
  background:var(--white);
  padding:24px;
  border:1px solid var(--line);
  border-top:3px solid var(--gold);
  border-radius:4px;
}
.preview h2 {
  margin-bottom:10px;
}
.preview p {
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.tabs {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:22px;
  padding-bottom:12px;
  border-bottom:1px solid var(--line);
}
.tabs .active {
  background:var(--teal-soft);
  border-color:var(--teal);
  color:var(--teal);
  box-shadow:inset 0 -3px 0 var(--gold);
}
.login-page {
  min-height:100dvh;
  display:grid;
  grid-template-columns:1fr 1fr;
  background:var(--bg);
}
.login-aside {
  background:linear-gradient(145deg,#542b35,var(--navy) 70%);
  color:var(--white);
  padding:clamp(32px,5vw,72px);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  gap:50px;
  border-inline-end:1px solid #a67983;
}
.login-aside h1 {
  font-size:clamp(2rem,3.5vw,3.25rem);
  line-height:1.65;
  max-width:460px;
}
.login-aside p {
  color:#ead9d6;
  max-width:440px;
  margin-top:24px;
  font-size:1.05rem;
}
.login-aside .brand {
  padding:0;
}
.login-main {
  display:flex;
  align-items:center;
  justify-content:center;
  padding:48px 32px;
  background:var(--bg);
}
.login-form {
  width:100%;
  max-width:460px;
  padding:32px;
  background:var(--white);
  border:1px solid var(--line);
  border-top:4px solid var(--gold);
  border-radius:6px;
}
.login-form h2 {
  font-size:1.8rem;
  margin-bottom:12px;
  line-height:1.65;
}
.login-form p {
  margin-bottom:32px;
  color:var(--muted);
}
.login-form label {
  margin-bottom:20px;
}
.login-form .btn {
  width:100%;
  margin-top:8px;
  min-height:50px;
}
.login-foot {
  border-top:1px dashed #a67983;
  padding-top:25px;
  color:#ead9d6;
  font-size:.875rem;
  line-height:1.8;
}
.mobile-menu {
  display:none;
}
.form-error {
  margin-top:16px;
}
dialog {
  padding:0;
  width:min(960px,calc(100% - 48px));
  max-height:calc(100dvh - 48px);
  border:1px solid #b6a58f;
  border-radius:10px;
  box-shadow:0 24px 80px #2b202333;
  color:var(--ink);
  margin:auto;
  border-top:4px solid var(--gold);
  background:var(--white);
  direction:rtl;
  overflow-y:auto;
  overscroll-behavior:contain;
  scroll-padding-block:100px 110px;
  scrollbar-gutter:stable;
}
dialog::backdrop {
  background:#2b202399;
  backdrop-filter:blur(4px);
}
.dialog-head {
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  padding:20px 28px;
  border-bottom:1px solid var(--line);
  position:sticky;
  top:0;
  background:var(--white);
  z-index:2;
  gap:16px;
  box-shadow:0 3px 0 #2b202306;
}
.dialog-body {
  padding:28px;
  min-width:0;
}
#toast {
  position:fixed;
  bottom:max(24px,env(safe-area-inset-bottom));
  left:24px;
  max-width:min(460px,calc(100% - 48px));
  background:var(--navy);
  color:var(--white);
  border-radius:6px;
  padding:16px 22px;
  z-index:100;
  box-shadow:0 8px 25px #2b202326;
  display:none;
  line-height:1.8;
  border:1px solid #a67983;
  border-inline-start:4px solid var(--gold);
  overflow-wrap:anywhere;
}
#print-root {
  display:none;
}
.break-text {
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
@media(max-width:1100px) {
  .shell {
    grid-template-columns:210px minmax(0,1fr);
  }
  .main {
    padding:25px 20px;
  }
  .topbar {
    padding:18px 20px;
  }
  .grid.four {
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
  .stat {
    padding:16px;
  }
}
@media(max-width:760px) {
  .shell {
    display:block;
  }
  .sidebar {
    display:none;
    position:fixed;
    right:0;
    width:min(290px,calc(100vw - 48px));
    z-index:20;
  }
  .sidebar.open {
    display:flex;
    box-shadow:-20px 0 100px #2b202359;
  }
  .mobile-menu {
    display:inline-flex;
  }
  .topbar {
    padding:12px 16px;
    min-height:70px;
  }
  .topbar .organization {
    display:none;
  }
  .main {
    padding:22px 14px;
  }
  .page-head {
    align-items:flex-start;
    flex-wrap:wrap;
    margin-bottom:20px;
  }
  h1 {
    font-size:1.45rem;
  }
  .page-head p {
    font-size:.875rem;
  }
  .stats {
    gap:8px;
    margin-bottom:18px;
  }
  .stat {
    padding:12px;
    display:block;
  }
  .stat span {
    font-size:.8rem;
    display:block;
    margin-bottom:8px;
  }
  .stat strong {
    font-size:1.4rem;
  }
  .grid,.grid.three,.grid.four {
    grid-template-columns:1fr;
  }
  .toolbar {
    padding:14px;
  }
  .toolbar input {
    max-width:none;
    flex:1;
    min-width:160px;
  }
  .toolbar select {
    flex:1;
  }
  .panel-pad {
    padding:18px;
  }
  .dialog-body,.dialog-head {
    padding:18px;
  }
  dialog {
    width:calc(100% - 16px);
    max-height:calc(100dvh - 16px);
    border-radius:8px;
  }
  .form-actions {
    position:sticky;
    bottom:-18px;
    background:var(--white);
    padding:14px 0;
    margin-top:20px;
    z-index:1;
    flex-wrap:wrap;
  }
  .form-actions .btn {
    flex:1;
  }
  .login-page {
    display:block;
  }
  .login-aside {
    padding:24px;
    gap:22px;
  }
  .login-aside h1 {
    font-size:1.65rem;
  }
  .login-aside p,.login-foot {
    display:none;
  }
  .login-main {
    padding:32px 22px;
  }
  .login-form h2 {
    font-size:1.4rem;
  }
  .table-wrap table {
    min-width:630px;
  }
  td,th {
    padding:12px;
  }
  .extra-row {
    grid-template-columns:minmax(0,1fr) 100px auto;
  }
  .line-editor {
    padding:14px;
  }
  .total-card {
    flex-wrap:wrap;
  }
}
@media print {
  @page {
    size:A4;
    margin:15mm;
  }
  body {
    background:white;
    font-size:12pt;
    color:#000;
  }
  #app,dialog,#toast {
    display:none!important;
  }
  #print-root {
    display:block!important;
  }
  #print-root h1 {
    font-size:22pt;
    margin-bottom:10mm;
  }
  #print-root table {
    font-size:11pt;
    table-layout:auto;
    width:100%;
    min-width:0;
  }
  #print-root td,#print-root th {
    padding:3mm;
    border:1px solid #b6a58f;
    white-space:normal;
    overflow-wrap:anywhere;
  }
  thead {
    display:table-header-group;
  }
  tfoot {
    display:table-row-group;
  }
  tr {
    break-inside:avoid;
  }
  p {
    white-space:pre-wrap;
    overflow-wrap:anywhere;
  }
  .print-meta {
    margin-bottom:8mm;
  }
  .print-total {
    margin-top:8mm;
    border-top:2px solid #2b2023;
    padding-top:4mm;
    font-size:16pt;
    font-weight:bold;
  }
}
[hidden] {
  display:none!important;
}
@media(max-width:760px) {
  #list-results .table-wrap table,#list-results tbody {
    display:block;
    min-width:0;
    width:100%;
  }
  #list-results thead {
    display:none;
  }
  #list-results tbody tr {
    display:grid;
    grid-template-columns:1fr 1fr;
    padding:16px;
    gap:12px;
    border-bottom:1px solid var(--line);
  }
  #list-results td {
    display:block;
    padding:0;
    border:0;
    min-width:0;
  }
  #list-results td:first-child,#list-results td:last-child {
    grid-column:1/-1;
  }
  #list-results td:before {
    content:attr(data-label);
    display:block;
    color:var(--muted);
    font-size:.8rem;
    margin-bottom:5px;
  }
  #list-results td:first-child:before,#list-results td:last-child:before {
    display:none;
  }
  #list-results .table-title {
    min-width:0;
  }
  #list-results .actions {
    padding-top:8px;
  }
  #list-results .actions .btn {
    flex:1;
    min-height:42px;
  }
}
.extras .extra-row {
  grid-template-columns:repeat(2,minmax(0,1fr));
  padding:16px;
  border-radius:5px;
  background:#f4ebdd;
  align-items:end;
  border:1px dashed #b6a58f;
  gap:12px;
}
.extras .extra-row .btn {
  justify-self:start;
}
.total-card+.total-card {
  margin-top:12px;
  border-top:1px dashed #b6a58f;
}
/* Additions use existing classes;
no HTML or JavaScript changes required. */
::selection {
  background:#e3c795;
  color:#2b2023;
}
input::placeholder,textarea::placeholder {
  color:#75646a;
  opacity:1;
}
input:focus,select:focus,textarea:focus {
  border-color:var(--teal);
  box-shadow:0 0 0 3px #461a1f14;
}
input:disabled,select:disabled,textarea:disabled {
  background:#eee2cf;
  color:#75646a;
  cursor:not-allowed;
  opacity:1;
}
input[readonly],textarea[readonly] {
  background:#f4ebdd;
  border-style:dashed;
}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"] {
  border-color:var(--red);
}
input[type=email],input[type=url],input[type=tel] {
  direction:ltr;
  text-align:right;
  unicode-bidi:plaintext;
}
button:disabled:hover {
  box-shadow:none;
}
.btn.danger:hover {
  background:#f6e7e1;
  border-color:var(--red);
}
.sidebar-bottom .btn:hover {
  background:#542b35;
  border-color:#ead9d6;
}
.sidebar button:focus-visible,.sidebar a:focus-visible,.login-aside a:focus-visible {
  outline-color:#e3c795;
}
.brand-mark img {
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
}
.page-head>*,.dialog-head>*,.total-card>*,.split>* {
  min-width:0;
}
.stat:nth-child(2) {
  border-top-color:var(--teal);
}
.stat:nth-child(3) {
  border-top-color:var(--olive);
}
tbody tr:focus-within {
  background:#f4ebdd;
}
.total-card::before {
  content:"";
  position:absolute;
  inset-block:12px;
  inset-inline-start:10px;
  border-inline-start:1px dashed #b88a44;
  pointer-events:none;
}
.dialog-head h2 {
  font-size:1.2rem;
  overflow-wrap:anywhere;
}
.dialog-head .btn {
  flex-shrink:0;
  min-width:44px;
  min-height:44px;
}
.dialog-body .form-actions {
  position:sticky;
  bottom:-28px;
  z-index:1;
  background:var(--white);
  padding:16px 0;
  box-shadow:0 -8px 16px #fffbf4e6;
}
.dialog-body input,.dialog-body select,.dialog-body textarea,.dialog-body button {
  scroll-margin-block:100px 110px;
}
@media(max-width:760px) {
  .sidebar {
    padding-top:24px;
    height:100dvh;
  }
  .topbar {
    gap:10px;
  }
  .stat strong {
    font-size:clamp(1.1rem,4vw,1.4rem);
  }
  .toolbar input,.toolbar select {
    min-width:0;
    flex:1 1 180px;
  }
  .btn.small {
    min-height:44px;
  }
  .dialog-head {
    gap:12px;
  }
  .dialog-body .form-actions {
    bottom:-18px;
    padding-bottom:max(14px,env(safe-area-inset-bottom));
  }
  .login-form {
    padding:24px 20px;
  }
  .login-main {
    padding:24px 16px;
  }
  .preview {
    padding:18px;
  }
  .total-card {
    padding:18px 24px;
  }
  .extras .extra-row {
    grid-template-columns:1fr;
  }
}
@media(max-width:380px) {
  .stats {
    grid-template-columns:1fr;
  }
  .stat {
    display:flex;
    align-items:center;
    gap:10px;
  }
  .stat span {
    margin:0;
  }
  .extra-row {
    grid-template-columns:minmax(0,1fr) 90px;
  }
  .extra-row .btn {
    grid-column:1/-1;
    justify-self:start;
  }
  #list-results tbody tr {
    grid-template-columns:1fr;
  }
}
@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    animation:none!important;
    transition:none!important;
    scroll-behavior:auto!important;
  }
}
@media print {
  :root {
    --white:#fff;
    --bg:#fff;
    --ink:#000;
    --muted:#444;
    --line:#aaa;
  }
  .preview,.panel,.stat,.total-card,.line-editor {
    background:white;
    box-shadow:none;
  }
  .total-card::before {
    display:none;
  }
  .money,.total-card strong {
    color:#000;
  }
}

.brand-mark > * {
  visibility:hidden;
}
.login-aside .brand {
  width:100%;
  max-width:380px;
}
.login-aside .brand-mark {
  height:112px;
}
@media(max-width:760px) {
  .login-aside .brand {
    max-width:300px;
  }
  .login-aside .brand-mark {
    height:90px;
  }
}

/* Real company logo, swapped in for the placeholder letter mark. Wrapped in a light
   card since the artwork's dark maroon text needs a light background to stay legible
   on the dark sidebar/login aside. */
.brand-mark-logo{width:auto;height:auto;min-width:0;background:var(--white,#fff);border-radius:8px;padding:6px 10px;display:inline-flex;align-items:center;justify-content:center;box-shadow:none}
.brand-mark-logo img{display:block;height:36px;width:auto;max-width:168px;object-fit:contain}
@media (max-width:760px){.brand-mark-logo img{height:30px}}

/* Company home screen: full room-by-room pricing shown directly, no dialog needed. */
.offer-card{background:var(--white,#fff);border:1px solid var(--line);border-radius:var(--radius,10px);padding:18px;margin-bottom:16px}
.offer-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}

/* Arkan Mecca PRO — additive presentation layer. Original selectors remain intact. */
.brand-mark-logo>img{visibility:visible}.brand-mark.brand-mark-logo{flex:0 1 auto}
:root{--ink:#292127;--muted:#756b71;--navy:#30151e;--teal:#572330;--teal-soft:#f6edf0;--line:#e9e2e5;--bg:#f7f6f8;--white:#fff;--gold:#b48b4b;--red:#ad3544;--radius:16px;--surface:#fff;--paper:#faf8f5;--focus:#ac8240;font-family:'Tajawal',Tahoma,Arial,sans-serif;line-height:1.65}
body,button,input,select,textarea,.num{font-family:'Tajawal',Tahoma,Arial,sans-serif}
body{background:var(--bg)}button,input,select,textarea{font-size:1rem}label,.nav button{font-weight:500}h1,h2,h3,.btn,th{font-weight:700}h1{letter-spacing:-.5px}.money,.stat strong,.price-value{font-weight:800}.num{font-variant-numeric:tabular-nums;letter-spacing:.1px}.btn{border-radius:10px;border-color:var(--line);min-height:44px;box-shadow:none}.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}.btn.primary:hover{background:#713243}.btn:hover{border-color:#c9b7be;background:#f8f2f4}.btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}.btn.small{padding:8px 13px;min-height:40px}.btn.ghost{background:transparent}input,select,textarea{border-color:#dcd4d9;border-radius:10px;background:#fff;font-weight:400}input:focus,select:focus,textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px #57233010}input[type=search]{padding-inline:16px}summary{cursor:pointer;font-weight:700}small{font-size:.84rem}
.shell{grid-template-columns:260px minmax(0,1fr)}.sidebar{background:var(--navy);padding:0 18px 20px;border:0;gap:24px}.sidebar>.brand{background:#faf8f5;margin:0 -18px;padding:25px 22px;min-height:112px;border-bottom:3px solid var(--gold)}.brand-mark-logo,.sidebar .brand-mark-logo,.login-aside .brand-mark-logo{background:transparent;border:0;border-radius:0;padding:0;box-shadow:none;width:auto;height:auto;max-width:100%}.brand-mark-logo img{height:auto;width:210px;max-width:100%;object-fit:contain;filter:none}.nav{gap:6px}.nav button{border-radius:10px;padding:13px 14px;min-height:48px;color:#e9dce1;font-size:1rem}.nav button.active{background:#fff;color:var(--teal);box-shadow:inset -3px 0 var(--gold);border-color:transparent;font-weight:700}.nav button:hover:not(.active){background:#ffffff0d}.sidebar-bottom{border-top:1px solid #ffffff20;padding-top:18px}.sidebar-bottom p{margin-top:5px}.sidebar-bottom .btn{border-color:#ffffff30}.topbar{background:#ffffffed;min-height:78px;padding:14px 32px;border-color:var(--line);position:sticky;top:0;z-index:5;backdrop-filter:blur(12px)}.avatar{border-radius:50%;background:#f2e7eb;color:var(--teal)}.main{max-width:1600px;margin:auto;padding:32px}.page-head{margin-bottom:26px;gap:20px}.page-head h1{font-size:clamp(1.5rem,2vw,2rem)}.page-head p{margin-top:5px;color:var(--muted)}.eyebrow{font-size:.77rem;letter-spacing:.8px;color:#9b763e;font-weight:700;margin-bottom:5px}.stats{gap:16px;margin-bottom:24px}.stat{border:1px solid var(--line);border-radius:14px;background:#fff;padding:19px 23px;box-shadow:0 4px 16px #30151e03;border-top:0}.stat strong{font-size:2rem;color:var(--teal)}.stat span{font-weight:500}.panel{border-radius:16px;border:1px solid var(--line);background:#fff;padding:22px;box-shadow:0 5px 24px #30151e03}.toolbar{gap:12px;align-items:end;padding-bottom:18px;flex-wrap:wrap;margin-bottom:16px;border-bottom:1px solid var(--line)}.toolbar label{min-width:150px;flex:1;font-size:.82rem;gap:5px}.toolbar .search-field{flex:2;min-width:220px}.toolbar input,.toolbar select{width:100%;max-width:none}.toolbar .btn{align-self:end}.filter-toggle{display:none}.filter-fields{display:flex;align-items:end;flex-wrap:wrap;gap:12px;flex:3;min-width:0}.result-summary{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;color:var(--muted);font-size:.88rem}.result-summary strong{color:var(--teal)}.filter-note{background:#fbf5e9;border:1px solid #eddfbf;padding:12px 15px;border-radius:10px;margin-bottom:16px;color:#785b2c}.table-wrap{border:1px solid var(--line);border-radius:12px;background:#fff;overflow-x:auto}table{width:100%}th{background:#f7f4f6;color:#65515b;font-size:.82rem;white-space:nowrap;padding:15px 16px;border-bottom:1px solid var(--line)}td{padding:16px;border-color:#f0eaed;font-size:.96rem;vertical-align:middle}tbody tr:hover{background:#fcfafb}td .table-title,td>b{display:block;color:var(--ink)}.badge{border-radius:6px;padding:4px 9px;font-size:.76rem;font-weight:700;background:#f3edf0;color:#725966;border:0}.badge.ok{background:#eaf5ee;color:#287347}.badge.danger{background:#fbecee;color:#a63146}.badge.gold{background:#fbf3e3;color:#8e692b}.empty{border:1px dashed #dccfd5;border-radius:14px;background:#fcfafb;padding:48px 20px}.empty strong{margin-bottom:7px}
.offer-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}.offer-card{margin:0;padding:0;border-radius:16px;border:1px solid var(--line);overflow:hidden;box-shadow:0 3px 14px #30151e04}.offer-card-head{padding:22px 24px 16px;margin:0;gap:14px;align-items:flex-start;border-bottom:1px solid #f1ecef}.offer-card h2{font-size:1.2rem;margin:6px 0 3px;line-height:1.55}.offer-card .offer-meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:.83rem}.offer-kind{font-size:.72rem;font-weight:700;color:#94713d;letter-spacing:.5px}.offer-card .table-wrap{border:0;border-radius:0;margin:0}.offer-card th{background:#fcfafb}.offer-card td:first-child{font-weight:700}.offer-card td small{font-weight:400;display:block}.offer-card .price-value{color:var(--teal);font-size:1.3rem;white-space:nowrap}.offer-card .price-value small{display:inline;font-size:.77rem;color:var(--muted)}.offer-card-actions{margin:0;padding:13px 24px;border-top:1px solid var(--line);background:#fcfafb;display:flex;justify-content:space-between;align-items:center;gap:12px}.offer-card-actions small{font-size:.78rem}.offer-description{padding:12px 24px;color:var(--muted);font-size:.87rem;white-space:pre-line;overflow-wrap:anywhere}.room-label{display:flex;align-items:center;gap:10px}.room-icon{width:35px;height:35px;display:grid;place-items:center;background:#f5eef1;border-radius:9px;color:var(--teal);flex:none}.room-icon svg{width:20px;height:20px}.room-label small{font-size:.76rem;margin-top:3px}.company-context{font-size:.82rem;margin:12px 24px;color:var(--teal);font-weight:500}.actions-trigger{white-space:nowrap;min-width:108px}.actions-trigger span:last-child{font-size:1.15rem}.action-source[hidden]{display:none!important}.pro-menu{position:fixed;z-index:2000;width:230px;max-width:calc(100vw - 24px);max-height:calc(100dvh - 24px);overflow-y:auto;padding:7px;background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:0 16px 50px #30151e26;direction:rtl}.pro-menu .btn{display:flex;width:100%;justify-content:flex-start;min-height:44px;border:0;background:transparent!important;color:var(--ink)!important;border-radius:7px;font-weight:500;text-align:right;margin:0}.pro-menu .btn:hover,.pro-menu .btn:focus-visible{background:#f7f0f3!important}.pro-menu .danger-action{color:#ab3347!important;border-top:1px solid var(--line);border-radius:0}.result{margin-top:22px}.calculation-head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:15px}.calculation-head h3{font-size:1.12rem}.calculation-head p{font-size:.84rem;color:var(--muted)}.calculation-table th:last-child{background:#572330;color:#fff}.calculation-table td:last-child{background:#faf2f5}.calculation-table .money{font-size:1.28rem;color:var(--teal)}.profit-positive{color:#287347}.profit-negative{color:#ad3544}.profit-rate{display:block;font-size:.75rem}.cost-breakdown{padding:14px 16px;margin-top:14px;border:1px solid var(--line);border-radius:12px;background:#faf9fb}.cost-breakdown summary{font-size:.9rem}.cost-breakdown .table-wrap{margin-top:12px}.hint{border-radius:10px;line-height:1.8}.section{margin-top:22px}.grid{gap:18px}.divider{margin:24px 0;border-color:var(--line)}dialog{width:min(1120px,calc(100% - 48px));max-height:calc(100dvh - 48px);border:1px solid var(--line);border-radius:18px;border-top:3px solid var(--gold);box-shadow:0 28px 100px #30151e40}.dialog-head{padding:20px 26px;background:#fff}.dialog-head h2{font-size:1.18rem}.dialog-body{padding:25px}.form-actions{gap:10px;padding-top:18px}.dialog-body form>.form-actions{position:sticky;bottom:-25px;background:#fffffff5;backdrop-filter:blur(10px);padding:16px 0;margin-bottom:-6px;border-top:1px solid var(--line);z-index:1}.login-page{background:#fff;min-height:100dvh}.login-aside{background:#faf8f5;color:var(--teal);border-inline-end:1px solid #ece3d9;position:relative}.login-aside .brand{padding:0}.login-aside .brand-mark-logo img{width:310px;max-width:100%}.login-aside h1{color:var(--teal);font-size:clamp(2rem,3.2vw,3.2rem);line-height:1.45}.login-aside p,.login-foot{color:#806f72}.login-foot{border-color:#ddcbb5}.login-main{padding:48px}.login-form{max-width:420px;width:100%}.login-form h2{font-size:1.8rem}.login-form>p{font-size:.95rem}.login-form .btn.primary{font-size:1.03rem;min-height:52px}.login-form label{font-weight:500}#toast{border-radius:12px;border-color:#76515d;box-shadow:0 12px 40px #30151e25}.drawer-backdrop{display:none}.drawer-close{display:none}.print-brand{width:195px;height:auto;display:block;margin-bottom:22px}.preview{background:#fff}.print-meta{border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:18px}.break-text{overflow-wrap:anywhere}[hidden]{display:none!important}

/* ===== Release 2 — offers toolbar, view switch, pricing workspace, quote builder ===== */
.toolbar{align-items:center}
.toolbar-main{display:flex;align-items:center;gap:10px;flex:1;min-width:240px}
.toolbar .search-field{flex:1;min-width:0;margin:0}
.toolbar label.search-field{font-size:0}
.toolbar label.search-field input{font-size:1rem}
.filter-fields{align-items:center;gap:10px}
.filter-fields label{display:flex;flex-direction:row;align-items:center;gap:7px;min-width:0;flex:0 1 auto;font-size:.8rem;color:var(--muted)}
.filter-fields label select{width:auto;min-width:118px;max-width:190px;padding-block:9px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:.82rem;font-weight:500;color:var(--muted);min-height:38px;cursor:pointer}
.chip:hover{border-color:#c9b7be;background:#f8f2f4}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.chip:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.filter-clear{margin-inline-start:auto;background:transparent;border:0;color:var(--red);font-weight:500;font-size:.84rem;min-height:38px;padding:0 6px;cursor:pointer;text-decoration:underline}
.filter-clear:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.filter-count{background:var(--gold);color:#fff;border-radius:999px;padding:1px 8px;font-size:.72rem;margin-inline-start:6px}
.view-switch{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.view-switch button{border:0;background:#fff;color:var(--muted);padding:8px 14px;font-size:.82rem;font-weight:500;min-height:38px;cursor:pointer}
.view-switch button+button{border-inline-start:1px solid var(--line)}
.view-switch button[aria-pressed="true"]{background:var(--teal-soft);color:var(--teal);font-weight:700}
.view-switch button:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
.offer-grid{grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}
.offer-card h2{font-size:1.08rem;margin:5px 0 2px}
.offer-card-head{padding:16px 18px 13px}
.offer-trip{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:700;color:#6c4f8a;background:#f2edf7;border-radius:999px;padding:3px 10px}
.offer-from{padding:13px 18px;display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-bottom:1px solid #f1ecef}
.offer-from small{color:var(--muted);font-size:.79rem}
.offer-from .price-value{font-size:1.45rem;color:var(--teal);white-space:nowrap}
.price-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;padding:13px 18px}
.price-tile{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fcfafb;min-width:0}
.price-tile b{display:block;font-size:.78rem;font-weight:500;color:var(--muted);overflow-wrap:anywhere}
.price-tile .num{font-size:1.02rem;font-weight:800;color:var(--ink)}
.price-tile small{display:block;font-size:.7rem;color:var(--muted);margin-top:2px}
.offer-card .details-toggle{padding:0 18px 13px}
.offer-card .details-toggle>summary{font-size:.83rem;color:var(--teal);font-weight:500}
.offer-card .details-toggle .table-wrap{margin-top:10px;border:1px solid var(--line);border-radius:10px}
.compare-wrap{border:1px solid var(--line);border-radius:12px;background:#fff;overflow-x:auto}
.compare-table{width:100%;min-width:640px}
.compare-table th{background:#f7f4f6;position:sticky;top:0;z-index:1}
.compare-table td{font-size:.92rem;white-space:nowrap}
.compare-table td.room-cell{text-align:center}
.compare-table td.room-cell.empty-cell{color:#c3b6bc}
.compare-table .table-title{font-weight:700}
.compare-table tr.archived-row td:first-child{opacity:.72}
.compare-group{padding:16px 2px 8px;font-size:.9rem;font-weight:700;color:var(--teal)}
.value-switch{display:inline-flex;gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.value-switch button{border:0;background:#fff;color:var(--muted);padding:6px 12px;font-size:.78rem;min-height:34px;cursor:pointer}
.value-switch button+button{border-inline-start:1px solid var(--line)}
.value-switch button[aria-pressed="true"]{background:var(--teal);color:#fff;font-weight:700}
.value-switch button:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
.workbench{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,1fr);gap:20px;align-items:start}
.workbench-form{min-width:0}
.workbench-side{position:sticky;top:14px;border:1px solid var(--line);border-radius:14px;background:#fcfafb;padding:16px}
.workbench-side h3{font-size:.95rem;margin-bottom:12px;display:flex;align-items:center;gap:7px}
.live-dot{width:8px;height:8px;border-radius:50%;background:#2f8a58;flex:none}
.live-stale .live-dot{background:var(--gold)}
.live-stat{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:9px}
.live-stat span{display:block;font-size:.76rem;color:var(--muted)}
.live-stat strong{font-size:1.42rem;font-weight:800;color:var(--ink)}
.live-stat.profit strong{color:#287347}
.live-stat.profit.negative strong{color:var(--red)}
.live-rooms{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
.live-rooms h4{font-size:.78rem;color:var(--muted);font-weight:500;margin-bottom:7px}
.live-row{display:flex;justify-content:space-between;gap:10px;font-size:.86rem;padding:6px 0;border-top:1px solid #f0eaed}
.live-row:first-of-type{border-top:0}
.live-row span{color:var(--muted)}
.live-row b{font-weight:700}
.live-row.below b{color:var(--red)}
.live-error{background:#fbecee;color:#a63146;border-radius:10px;padding:10px 12px;font-size:.84rem;line-height:1.7}
.step-head{display:none}
.night-quick{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.night-quick button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 14px;font-size:.82rem;min-height:38px;color:var(--muted);cursor:pointer}
.night-quick button[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft);color:var(--teal);font-weight:700}
.night-quick button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.trip-field{border:1px solid #e4d9ea;background:#faf7fc;border-radius:12px;padding:12px 14px;margin-bottom:16px}
.trip-field label{margin:0}
.trip-field small{display:block;color:var(--muted);font-size:.78rem;margin-top:6px}
.quote-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;background:#faf8fa;border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:16px}
.quote-toolbar label{flex:1;min-width:190px;margin:0;font-size:.82rem}
.quote-toolbar .btn{min-width:150px}
.bulk-margin{display:flex;gap:10px;flex-wrap:wrap;align-items:end;border-top:1px solid var(--line);margin-top:12px;padding-top:12px;flex-basis:100%}
.line-row{border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px 14px;margin-bottom:10px}
.line-row-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.line-row-head h3{font-size:.97rem;line-height:1.55}
.line-row-head small{color:var(--muted);font-size:.79rem;display:block;margin-top:2px}
.line-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px}
.line-grid label{margin:0;font-size:.78rem}
.line-summary{margin-top:10px;border-top:1px solid #f0eaed;padding-top:9px}
.line-extras>summary{font-size:.82rem;color:var(--teal);margin-top:10px}
.quote-result .table-wrap{margin-top:12px}
.quote-result th:last-child{background:var(--teal);color:#fff}
.quote-result td:last-child{background:#faf2f5;font-weight:800}
.quote-total-row{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--teal-soft);border-radius:12px;padding:14px 18px;margin-top:12px}
.quote-total-row strong{font-size:1.5rem;color:var(--teal);font-weight:800}
@media(max-width:1180px){.workbench{grid-template-columns:minmax(0,1fr)}.workbench-side{position:static}}
@media(max-width:760px){
 .toolbar-main{width:100%;flex-wrap:wrap}
 .view-switch{width:100%}
 .view-switch button{flex:1}
 .filter-fields label{flex-basis:100%}
 .filter-fields label select{width:100%;max-width:none}
 .filter-clear{width:100%;margin:4px 0 0}
 .chips{width:100%}
 .chip{flex:1;text-align:center}
 .offer-grid{grid-template-columns:minmax(0,1fr)}
 .price-tiles{grid-template-columns:repeat(2,minmax(0,1fr));padding:12px 14px;gap:7px}
 .offer-from{padding:12px 14px}
 .offer-card .details-toggle{padding:0 14px 12px}
 .compare-table{min-width:560px}
 .workbench-side{border:0;border-radius:0;padding:0;background:transparent}
 .step-head{display:block;margin-bottom:14px}
 .step-bar{display:flex;gap:5px;margin-top:9px}
 .step-bar i{flex:1;height:4px;border-radius:2px;background:#e2d8dd}
 .step-bar i.done{background:var(--teal)}
 .step-title{font-size:1.02rem;font-weight:700;margin-top:9px}
 .step-index{font-size:.76rem;color:var(--muted)}
 .step-pane[hidden]{display:none!important}
 .live-bar{position:sticky;bottom:0;z-index:3;background:#fffffff5;backdrop-filter:blur(10px);border-top:1px solid var(--line);margin:0 -15px -15px;padding:11px 15px}
 .live-bar-figures{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;margin-bottom:9px;flex-wrap:wrap}
 .live-bar-figures b{font-weight:800}
 .live-bar-figures .profit{color:#287347}
 .live-bar-figures .profit.negative{color:var(--red)}
 .step-nav{display:flex;gap:8px}
 .step-nav .btn{flex:1}
 .dialog-body form>.form-actions{position:static;background:transparent;backdrop-filter:none;padding-top:14px}
 .quote-toolbar label{flex-basis:100%}
 .quote-toolbar .btn{width:100%}
 .line-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .quote-total-row{padding:12px 14px}
 .quote-total-row strong{font-size:1.25rem}
}
@media print{.view-switch,.chips,.filter-clear,.night-quick,.live-bar,.workbench-side{display:none!important}}

  const step=Math.min(Number(form.dataset.step||0),panes.length-1);

  panes.forEach((pane,index)=>{pane.hidden=narrow&&index!==step;});
  if(head){
    head.hidden=!narrow;
    head.innerHTML=narrow?`<div class="step-bar">${panes.map((p,i)=>`<i class="${i<=step?'done':''}"></i>`).join('')}</div><div class="step-index">خطوة ${step+1} من ${panes.length}</div><div class="step-title">${c(panes[step].dataset.title)}</div>`:'';
  }
  if(bar){

function proHandleAction(own){
  switch(own.dataset.pro){
    case'chip':{
            if(own.dataset.field==='kind')s.kind=own.dataset.value;else proFilters.status=own.dataset.value;
      gi();break;
    }
    case'view':{
            proView.offers=own.dataset.value;sessionStorage.setItem('rihla_view',own.dataset.value);gi();break;
    }
    case'value':{
            sessionStorage.setItem('rihla_value',own.dataset.value);ve();break;
    }
    case'nights':{
            const input=d('[name='+own.dataset.field+']');
      if(!input)break;
      input.value=own.dataset.value;
      input.dispatchEvent(new Event('input',{bubbles:true}));
      [...own.parentElement.children].forEach(button=>button.setAttribute('aria-pressed',String(button===own)));
      break;
    }
    case'step':{

      form.dataset.step=String(Number(form.dataset.step||0)+Number(own.dataset.value));
      proSyncSteps(form);
      const live=proActiveLive();if(live)proRenderLive(live);
      form.scrollIntoView({block:'start'});
      break;
    }
    case'quote-offer':{
            const id=d('[name=newOffer]').value;
      const assignment=proQuoteOffers().find(row=>row.id===id);
      if(!assignment){q('اختر العرض أولاً.');break;}
      s.editor.lines=Q();
      const room=60-s.editor.lines.length;
      if(room<=0){q('بلغت الحد الأقصى 60 بنداً في التسعيرة الواحدة.');break;}
      assignment.lines.slice(0,room).forEach(line=>s.editor.lines.push(ai(assignment,line.key)));
      te();C();
      q('أُضيفت '+Math.min(room,assignment.lines.length)+' بنود من «'+assignment.name+'».');
      break;
    }
    case'quote-margin':{
            const type=d('[name=bulkMarginType]').value,value=d('[name=bulkMarginValue]').value;
      x('.line-editor').forEach(row=>{
        row.querySelector('[name=mode]').value='margin';
        row.querySelector('[name=marginType]').value=type;
        row.querySelector('[name=marginValue]').value=value;
      });
      Pe();C();q('طُبّق الربح الموحّد على كل البنود. يمكنك تعديل أي بند بعدها.');
      break;
    }
  }
}
